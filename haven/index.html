<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   Conversation engine
   A rule-based, CBT / motivational-interviewing–informed engine.
   No text ever leaves the browser — everything below runs locally.
   ============================================================ */

const EMOTIONS = {
  sadness: { label: 'sadness', words: ['sad','down','depressed','crying','tears','heartbroken','miserable','hurt','grief','grieving'] },
  anxiety: { label: 'anxiety', words: ['anxious','anxiety','worried','worry','panic','nervous','scared','afraid','racing thoughts','on edge','dread'] },
  anger: { label: 'anger', words: ['angry','mad','furious','irritated','resentful','frustrated','pissed','rage'] },
  stress: { label: 'stress', words: ['stressed','stress','burnt out','burned out','exhausted','overworked','behind','deadline','overwhelmed','too much','swamped'] },
  guilt: { label: 'guilt', words: ['guilty','ashamed','shame','my fault','failure','let everyone down','embarrassed'] },
  numb: { label: 'numbness', words: ['numb','empty','flat',"don't care","can't feel",'nothing matters','disconnected'] },
  lonely: { label: 'loneliness', words: ['lonely','alone','isolated','no one','nobody understands','left out'] },
  okay: { label: 'steadiness', words: ['okay','fine','alright','good','better','calm','peaceful','grateful','proud'] }
};

const DISTORTIONS = [
  { key: 'allOrNothing', name: 'all-or-nothing thinking',
    patterns: [/\balways\b/i, /\bnever\b/i, /\beveryone\b/i, /\bno ?one\b/i, /\bcompletely (ruined|failed|useless)\b/i, /\btotal(ly)? (failure|disaster)\b/i],
    reflect: "I noticed some black-and-white language in there — a word like \"always\" or \"never.\"",
    reframe: "Rarely is anything 100% one way. Is there an exception, even a small one, to that always or never?" },
  { key: 'catastrophizing', name: 'catastrophizing',
    patterns: [/\bdisaster\b/i, /\bruined\b/i, /\bthe worst\b/i, /\bcan'?t handle\b/i, /\bcatastrophe\b/i, /\bfalling apart\b/i],
    reflect: "It sounds like your mind jumped straight to the worst-case version of this.",
    reframe: "If a friend told you this happened to them, would you call it a disaster — or a hard day?" },
  { key: 'shouldStatements', name: 'a "should" statement',
    patterns: [/\bi should(n'?t)? have\b/i, /\bi should\b/i, /\bi have to\b/i, /\bi must\b/i, /\bsupposed to\b/i],
    reflect: "I'm hearing a strict rule for yourself in there — a \"should\" or a \"have to.\"",
    reframe: "Where did that rule come from? Would you hold someone you love to it this strictly?" },
  { key: 'mindReading', name: 'mind reading',
    patterns: [/\bthey think\b/i, /\bthey probably\b/i, /\beveryone thinks\b/i, /\bhe (hates|thinks)\b/i, /\bshe (hates|thinks)\b/i, /\bthey hate me\b/i, /\bthey must think\b/i],
    reflect: "It sounds like you might be guessing at what someone else is thinking.",
    reframe: "What's the actual evidence for that — something they said or did, not just a feeling?" },
  { key: 'labeling', name: 'a harsh label',
    patterns: [/\bi'?m (such a |such an )?(failure|loser|mess|idiot|disaster)\b/i, /\bi'?m stupid\b/i, /\bi'?m worthless\b/i, /\bi'?m broken\b/i, /\bi'?m pathetic\b/i],
    reflect: "That's a heavy label to put on all of yourself over one thing.",
    reframe: "Would you describe a friend that harshly for the same mistake? What would you call it instead?" },
  { key: 'personalization', name: 'personalization',
    patterns: [/\bmy fault\b/i, /\bbecause of me\b/i, /\bi ruined\b/i, /\bi caused\b/i, /\bif i had(n'?t)?\b/i],
    reflect: "You're carrying a lot of the blame for this yourself.",
    reframe: "What parts of this were actually in your control, and what parts genuinely weren't?" },
  { key: 'fortuneTelling', name: 'fortune telling',
    patterns: [/\bit'?s going to fail\b/i, /\bnothing (will|ever) (change|work)\b/i, /\bwon'?t get better\b/i, /\bnever going to\b/i, /\bpointless\b/i],
    reflect: "It sounds like you're predicting how this ends before it's actually played out.",
    reframe: "What's one version of how this could go that isn't the worst case?" }
];

// Kept broad on purpose: for crisis language, a false positive (showing
// resources unnecessarily) is a far smaller cost than a missed one.
const CRISIS_PATTERNS = [
  /\bkill(ing)? myself\b/i, /\bend(ing)? my life\b/i, /\bsuicid\w*\b/i,
  /\bwant(ed)? to die\b/i, /\bdon'?t want to (be alive|live|wake up)\b/i, /\bno reason to live\b/i,
  /\bbetter off dead\b/i, /\bbetter off without me\b/i, /\bhurt(ing)? myself\b/i, /\bharm(ing)? myself\b/i,
  /\bself[- ]?harm\b/i, /\bcutting myself\b/i, /\bcan'?t (go on|do this anymore)\b/i, /\bplan to (die|kill)\b/i,
  /\bgoodbye forever\b/i, /\bending it all\b/i, /\bending it\b/i, /\bnot (worth|going to be) around\b/i,
  /\btake my (own )?life\b/i, /\boverdose\b/i, /\bwish i (was|were) dead\b/i, /\bhurt (someone|him|her|them)\b/i,
  /\bi'?m going to kill\b/i
];

const QUESTIONS = {
  sadness: ["What's the heaviest part of this to sit with right now?", "How long has this feeling been building?", "Is there anyone in your corner you've been able to tell this to?"],
  anxiety: ["What's the worry your mind keeps circling back to?", "If that worry actually came true, what would you do next?", "Where do you notice this in your body right now?"],
  anger: ["What do you think is underneath the anger — hurt, fear, something else?", "What would feel fair here?", "What is this anger telling you that you need?"],
  stress: ["If you could put down just one thing on your plate today, what would it be?", "What's actually urgent here, versus what just feels urgent?", "What would 'enough for today' look like?"],
  guilt: ["What would you say to a friend who felt this guilty over the same thing?", "What part of this was actually your choice?", "What would it take to forgive yourself a little here?"],
  numb: ["When did you last feel something different than this, even briefly?", "Is numb maybe protecting you from something bigger right now?", "What's one small thing that usually helps you feel present?"],
  lonely: ["Who's someone you've felt closest to, even a little, this year?", "What does connection look like for you when it's working?", "Is there a small reach-out you could make today, even a short one?"],
  okay: ["What's been going right lately?", "What's helped you feel steady?", "Anything you want to keep an eye on, even if today's okay?"]
};
const GENERIC_QUESTIONS = ["What feels most important to say next?", "What's been sitting with you today?", "Is there more to that you want to say?"];

const TOOLS = {
  breathing: { label: 'Box breathing', icon: '🫁', text: "Try this for four rounds: breathe in for 4 counts, hold for 4, out for 4, hold for 4." },
  grounding: { label: '5-4-3-2-1 grounding', icon: '🌿', text: "Name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, and 1 you can taste." },
  journaling: { label: 'A page to yourself', icon: '📝', text: "Try writing for 5 minutes without stopping — don't worry about it making sense." },
  activation: { label: 'One small step', icon: '🌱', text: "What's the smallest possible version of the thing you're avoiding? Could you do just that piece?" },
  bodyReset: { label: 'Body reset', icon: '💧', text: "Stand up, roll your shoulders, drink some water, unclench your jaw — small resets add up." },
  selfCompassion: { label: 'A kinder voice', icon: '💛', text: "Try a hand on your chest and saying: \"this is hard right now, and that's okay — I'm doing my best.\"" }
};

const EMOTION_OPENERS = {
  sadness: ["That sounds like it really hurts.", "I can hear how much weight that's carrying.", "That's a lot to feel."],
  anxiety: ["That sounds like a lot of worry to be holding.", "I can hear how on edge that's made you.", "That sounds unsettling to sit with."],
  anger: ["That sounds really frustrating.", "I can hear how much that's grating on you.", "That sounds like it crossed a line for you."],
  stress: ["That sounds like a lot to carry at once.", "I can hear how stretched thin you're feeling.", "That sounds exhausting."],
  guilt: ["That sounds like a heavy thing to carry.", "I can hear how much that's weighing on you."],
  numb: ["Thanks for naming that, even flat can be hard to describe.", "That sounds like a hard place to be sitting."],
  lonely: ["That sounds like a lonely place to be.", "I can hear how isolating that feels."],
  okay: ["Good to hear.", "I'm glad that's where things are right now.", "Thanks for sharing that."]
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function weightedPick(weightMap, keys) {
  const weights = keys.map(k => (weightMap && weightMap[k]) || 1);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < keys.length; i++) { r -= weights[i]; if (r <= 0) return keys[i]; }
  return keys[keys.length - 1];
}

function analyze(text) {
  const lower = text.toLowerCase();
  const crisis = CRISIS_PATTERNS.some(p => p.test(lower));
  const distortion = DISTORTIONS.find(d => d.patterns.some(p => p.test(lower))) || null;
  let emotion = null, bestScore = 0;
  Object.entries(EMOTIONS).forEach(([key, def]) => {
    const score = def.words.reduce((s, w) => s + (lower.includes(w) ? 1 : 0), 0);
    if (score > bestScore) { bestScore = score; emotion = key; }
  });
  return { crisis, distortion, emotion };
}

function buildResponse(userText, weights, turnCount) {
  const { crisis, distortion, emotion } = analyze(userText);
  if (crisis) return { type: 'crisis' };

  const opener = distortion ? distortion.reflect : (emotion ? pick(EMOTION_OPENERS[emotion]) : "Thank you for telling me that.");
  const reframe = distortion ? { key: distortion.key, name: distortion.name, text: distortion.reframe } : null;
  const qBank = (emotion && QUESTIONS[emotion]) || GENERIC_QUESTIONS;
  const question = pick(qBank);

  const heavy = emotion && ['sadness', 'anxiety', 'stress', 'lonely', 'guilt'].includes(emotion);
  const offerTool = (turnCount > 0 && turnCount % 3 === 0) || (heavy && turnCount > 0 && turnCount % 2 === 0);
  let tool = null;
  if (offerTool) {
    const toolKey = weightedPick(weights, Object.keys(TOOLS));
    tool = { key: toolKey, ...TOOLS[toolKey] };
  }
  return { type: 'reflect', opener, reframe, question, tool, emotion, distortionKey: distortion ? distortion.key : null };
}

/* ============================================================
   Storage — local only. No transcript text is ever persisted;
   only mood check-ins and derived pattern/tool signals are.
   ============================================================ */

const STORAGE_KEY = 'haven-state-v1';
const THEME_KEY = 'haven-theme';

function defaultState() {
  return {
    onboarded: false,
    name: '',
    moodLog: [],           // { t, value(1-5) }
    distortionCounts: {},  // { key: n }
    weights: { coping: {} },
    toolFeedback: {}       // { key: { helped, notNow } }
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) { return defaultState(); }
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* best effort */ }
}

/* ============================================================
   Voice input (Web Speech API)
   ============================================================ */

function useVoiceInput(onResult) {
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const [error, setError] = useState(null);
  const recRef = useRef(null);
  const onResultRef = useRef(onResult);
  onResultRef.current = onResult;

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      onResultRef.current(final || interim, !!final);
    };
    rec.onend = () => setListening(false);
    rec.onerror = (e) => { setListening(false); setError(e.error || 'error'); };
    recRef.current = rec;
    return () => { try { rec.stop(); } catch (e) {} };
  }, []);

  const start = useCallback(() => {
    if (recRef.current && !listening) {
      setError(null);
      try { recRef.current.start(); setListening(true); } catch (e) {}
    }
  }, [listening]);
  const stop = useCallback(() => {
    if (recRef.current && listening) recRef.current.stop();
  }, [listening]);

  return { listening, supported, error, start, stop };
}

/* ============================================================
   Mood chart (SVG, no chart library)
   ============================================================ */

function MoodChart({ entries }) {
  const data = entries.slice(-14);
  const W = 560, H = 150, padX = 14, padY = 20;
  const stepX = data.length > 1 ? (W - padX * 2) / (data.length - 1) : 0;
  const yFor = (v) => H - padY - ((v - 1) / 4) * (H - padY * 2);
  const points = data.map((d, i) => ({ x: padX + i * stepX, y: yFor(d.value), ...d }));
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');

  if (data.length === 0) return null;

  const axisLabel = "text-[9px] font-body fill-ink-faint dark:fill-ink-dark-faint";

  return (
    <div className="relative">
      <svg className="w-full h-auto overflow-visible" viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="xMidYMid meet">
        <line x1={padX} y1={yFor(5)} x2={W - padX} y2={yFor(5)} className="stroke-line dark:stroke-line-dark" strokeWidth="1" />
        <line x1={padX} y1={yFor(1)} x2={W - padX} y2={yFor(1)} className="stroke-line dark:stroke-line-dark" strokeWidth="1" />
        <text x={padX} y={yFor(5) - 6} className={axisLabel}>great</text>
        <text x={padX} y={yFor(1) + 12} className={axisLabel}>rough</text>
        {data.length > 1 && <path d={path} fill="none" className="stroke-moss dark:stroke-moss-dark" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
        {points.map((p, i) => {
          const isLast = i === points.length - 1;
          return (
            <g key={i}>
              <circle cx={p.x} cy={p.y} r="9" fill="transparent">
                <title>{formatDay(p.t) + ' — ' + moodMeta(p.value).label + ' (' + p.value + '/5)'}</title>
              </circle>
              <circle cx={p.x} cy={p.y} r={isLast ? 5 : 3.5} className={isLast ? 'fill-moss dark:fill-moss-dark' : 'fill-paper-raised dark:fill-paper-dark-raised stroke-moss dark:stroke-moss-dark'} strokeWidth={isLast ? 0 : 2} />
              {isLast && <text x={p.x} y={p.y - 12} textAnchor="end" className={axisLabel + ' font-bold fill-moss dark:fill-moss-dark'}>{moodMeta(p.value).label}</text>}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function ChatView({ persisted, setPersisted, onOpenReflections, onOpenInfo, onCheckIn, moodToday }) {
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState('');
  const [typing, setTyping] = useState(false);
  const [turnCount, setTurnCount] = useState(0);
  const threadRef = useRef(null);
  const textareaRef = useRef(null);

  const handleVoiceResult = useCallback((text, isFinal) => {
    setDraft(text);
    if (isFinal && textareaRef.current) textareaRef.current.focus();
  }, []);
  const voice = useVoiceInput(handleVoiceResult);

  useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [messages, typing]);

  const recordDistortion = (key) => {
    if (!key) return;
    setPersisted(p => {
      const counts = { ...(p.distortionCounts || {}) };
      counts[key] = (counts[key] || 0) + 1;
      const next = { ...p, distortionCounts: counts };
      saveState(next);
      return next;
    });
  };

  const recordToolFeedback = (toolKey, positive) => {
    setPersisted(p => {
      const weights = { ...(p.weights.coping || {}) };
      const cur = weights[toolKey] || 1;
      weights[toolKey] = clamp(cur * (positive ? 1.15 : 0.85), 0.3, 4);
      const fb = { ...(p.toolFeedback || {}) };
      const cur2 = fb[toolKey] || { helped: 0, notNow: 0 };
      fb[toolKey] = positive ? { ...cur2, helped: cur2.helped + 1 } : { ...cur2, notNow: cur2.notNow + 1 };
      const next = { ...p, weights: { ...p.weights, coping: weights }, toolFeedback: fb };
      saveState(next);
      return next;
    });
  };

  const setMessageFeedback = (id, value) => {
    setMessages(ms => ms.map(m => (m.id === id ? { ...m, feedback: value } : m)));
  };

  const appendAgentTurn = (result) => {
    if (result.type === 'crisis') {
      setMessages(ms => [...ms, { id: uid(), role: 'crisis' }]);
      return;
    }
    setMessages(ms => {
      const additions = [{ id: uid(), role: 'agent', text: result.opener + (result.question ? ' ' + result.question : '') }];
      if (result.reframe) additions.push({ id: uid(), role: 'reframe', reframe: result.reframe });
      if (result.tool) additions.push({ id: uid(), role: 'tool', tool: result.tool });
      return [...ms, ...additions];
    });
    if (result.distortionKey) recordDistortion(result.distortionKey);
  };

  const handleSend = () => {
    const text = draft.trim();
    if (!text) return;
    setMessages(ms => [...ms, { id: uid(), role: 'user', text }]);
    setDraft('');
    if (textareaRef.current) textareaRef.current.style.height = 'auto';
    const result = buildResponse(text, persisted.weights.coping, turnCount);
    setTurnCount(t => t + 1);
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      appendAgentTurn(result);
    }, 550 + Math.random() * 500);
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  };

  const handleMicClick = () => {
    if (voice.listening) voice.stop(); else voice.start();
  };

  const newConversation = () => { setMessages([]); setTurnCount(0); };

  return (
    <div className="flex-1 flex flex-col max-w-[720px] w-full mx-auto min-h-0">
      <div className="flex items-center justify-between px-[clamp(16px,4vw,32px)] pt-2">
        <button className="subbar-btn" onClick={newConversation}>Start fresh</button>
        <button className="subbar-btn" onClick={onOpenReflections}><ChartIcon /> Reflections</button>
      </div>

      <div className="stitch-line flex-1 overflow-y-auto pr-[clamp(16px,4vw,32px)] pt-5 pb-2.5 flex flex-col" ref={threadRef}>
        {messages.length === 0 && (
          <div className="flex-1 flex items-center justify-center text-center text-ink-faint dark:text-ink-dark-faint px-5 py-10">
            <p className="max-w-[320px] text-[.92rem] leading-relaxed mx-auto">Say whatever's on your mind — typed or spoken. Haven will listen, ask a question or two, and
            offer something to try if it seems useful.</p>
          </div>
        )}
        {messages.map(m => {
          if (m.role === 'user') return <div key={m.id} className="turn-row user"><div className="bubble user">{m.text}</div></div>;
          if (m.role === 'agent') return <AgentBubble key={m.id}>{m.text}</AgentBubble>;
          if (m.role === 'reframe') return <ReframeCard key={m.id} reframe={m.reframe} />;
          if (m.role === 'tool') return <ToolCard key={m.id} tool={m.tool} feedback={m.feedback} onFeedback={(v) => { setMessageFeedback(m.id, v); recordToolFeedback(m.tool.key, v === 'helped'); }} />;
          if (m.role === 'crisis') return <CrisisCard key={m.id} />;
          return null;
        })}
        {typing && (
          <div className="turn-row agent">
            <div className="bubble agent flex items-center gap-[5px] py-1">
              <span className="typing-dot"></span>
              <span className="typing-dot [animation-delay:150ms]"></span>
              <span className="typing-dot [animation-delay:300ms]"></span>
            </div>
          </div>
        )}
      </div>

      <div className="px-[clamp(16px,4vw,32px)] pb-[clamp(14px,3vw,22px)] pt-2.5 border-t border-line dark:border-line-dark bg-paper dark:bg-paper-dark">
        {voice.error === 'not-allowed' && <p className="text-[.78rem] text-crisis dark:text-crisis-dark mb-2">Microphone access was blocked — you can still type.</p>}
        <div className="flex items-end gap-2 bg-paper-raised dark:bg-paper-dark-raised border border-line dark:border-line-dark rounded-[22px] pl-4 pr-2 py-2 shadow-s">
          <textarea
            ref={textareaRef}
            rows={1}
            className="flex-1 resize-none border-0 outline-none bg-transparent text-ink dark:text-ink-dark text-[.95rem] leading-relaxed py-2 max-h-[140px] placeholder:text-ink-faint dark:placeholder:text-ink-dark-faint"
            value={draft}
            placeholder={voice.listening ? 'Listening…' : "Type how you're feeling…"}
            onChange={e => { setDraft(e.target.value); e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; }}
            onKeyDown={handleKeyDown}
          />
          {voice.supported && (
            <button className={'mic-btn' + (voice.listening ? ' listening' : '')} onClick={handleMicClick} aria-label={voice.listening ? 'Stop listening' : 'Speak instead of typing'}>
              {voice.listening && <span className="mic-ring" aria-hidden="true"></span>}
              <MicIcon />
            </button>
          )}
          <button className="send-btn" onClick={handleSend} disabled={!draft.trim()} aria-label="Send">
            <SendIcon />
          </button>
        </div>
        <p className="text-center text-[.74rem] text-ink-faint dark:text-ink-dark-faint mt-2.5">
          Haven is a supportive tool, not a therapist. In crisis? <a href="tel:988">Call or text 988</a> (US). <button className="underline cursor-pointer bg-transparent border-0 text-inherit p-0" onClick={onOpenInfo}>More info</button>
        </p>
      </div>
    </div>
  );
}

/* ============================================================
   Top bar
   ============================================================ */

function TopBar({ theme, onToggleTheme, onOpenInfo, moodToday, onCheckIn, view, onGoChat }) {
  return (
    <div className="flex items-center justify-between px-[clamp(16px,4vw,32px)] py-3.5 border-b border-line dark:border-line-dark bg-paper dark:bg-paper-dark sticky top-0 z-20">
      <a className="flex items-center gap-2 no-underline text-ink dark:text-ink-dark" href="#" onClick={e => { e.preventDefault(); onGoChat(); }}>
        <BrandMark className="w-5 h-5 shrink-0" />
        <span className="font-display italic font-medium text-[1.28rem] tracking-wide">Haven</span>
      </a>
      <div className="flex items-center gap-1.5">
        <button className="mood-chip" onClick={onCheckIn}>
          {moodToday ? <React.Fragment>{moodMeta(moodToday.value).emoji} Logged today</React.Fragment> : 'Check in'}
        </button>
        <button className="icon-btn" onClick={onToggleTheme} aria-label="Toggle theme">
          {theme === 'dark' ? <SunIcon /> : <MoonIcon />}
        </button>
        <button className="icon-btn" onClick={onOpenInfo} aria-label="About Haven">
          <InfoIcon />
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */

function App() {
  const [persisted, setPersistedRaw] = useState(loadState());
  const [theme, setTheme] = useState(() => {
    try {
      const stored = localStorage.getItem(THEME_KEY);
      if (stored) return stored;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  });
  const [view, setView] = useState('chat');
  const [showInfo, setShowInfo] = useState(false);
  const [showCheckIn, setShowCheckIn] = useState(false);

  const setPersisted = (updater) => setPersistedRaw(prev => (typeof updater === 'function' ? updater(prev) : updater));

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.documentElement.style.colorScheme = theme;
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }, [theme]);

  const handleBegin = (name, mood) => {
    setPersisted(p => {
      const next = {
        ...p,
        onboarded: true,
        name,
        moodLog: [...p.moodLog, { t: Date.now(), value: mood.value }]
      };
      saveState(next);
      return next;
    });
  };

  const handleCheckIn = (value) => {
    setPersisted(p => {
      const next = { ...p, moodLog: [...p.moodLog, { t: Date.now(), value }].slice(-60) };
      saveState(next);
      return next;
    });
    setShowCheckIn(false);
  };

  const todayStr = new Date().toDateString();
  const moodToday = useMemo(() => {
    const todays = persisted.moodLog.filter(m => new Date(m.t).toDateString() === todayStr);
    return todays.length ? todays[todays.length - 1] : null;
  }, [persisted.moodLog]);

  if (!persisted.onboarded) {
    return <Onboarding onBegin={handleBegin} />;
  }

  return (
    <div className="flex flex-col min-h-screen min-h-dvh">
      <TopBar
        theme={theme}
        onToggleTheme={() => setTheme(t => (t === 'dark' ? 'light' : 'dark'))}
        onOpenInfo={() => setShowInfo(true)}
        moodToday={moodToday}
        onCheckIn={() => setShowCheckIn(true)}
        view={view}
        onGoChat={() => setView('chat')}
      />
      {view === 'chat' ? (
        <ChatView
          persisted={persisted}
          setPersisted={setPersisted}
          onOpenReflections={() => setView('reflections')}
          onOpenInfo={() => setShowInfo(true)}
          onCheckIn={() => setShowCheckIn(true)}
          moodToday={moodToday}
        />
      ) : (
        <Reflections state={persisted} onBack={() => setView('chat')} onCheckIn={() => setShowCheckIn(true)} />
      )}
      {showInfo && <InfoModal onClose={() => setShowInfo(false)} />}
      {showCheckIn && <MoodCheckInModal onClose={() => setShowCheckIn(false)} onPick={handleCheckIn} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
