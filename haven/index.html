<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haven — a quiet place to think out loud</title>
<meta name="description" content="Haven is a calm space to talk through what's on your mind, with reflective questions and gentle coping suggestions drawn from CBT and motivational interviewing.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF6EF;
    --paper-raised: #FFFFFF;
    --ink: #2B2A28;
    --ink-soft: #5B5750;
    --ink-faint: #928C7F;
    --line: #E4DDCF;
    --denim: #3A5068;
    --denim-deep: #253647;
    --denim-fill: #E4EAEF;
    --moss: #4C5D4A;
    --moss-fill: #DCE5D6;
    --ochre: #A8672A;
    --ochre-fill: #F3E1C4;
    --crisis: #A03A2A;
    --crisis-fill: #F6DAD3;
    --crisis-line: #E3B4A6;
    --shadow-s: 0 1px 2px rgba(43,42,40,.07);
    --shadow-m: 0 10px 30px -14px rgba(43,42,40,.28);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 22px;
    --font-display: 'Newsreader', Georgia, serif;
    --font-body: 'Karla', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #1B1E24;
    --paper-raised: #232730;
    --ink: #EDE8DE;
    --ink-soft: #B8B2A4;
    --ink-faint: #7C8089;
    --line: #333947;
    --denim: #8CA6BE;
    --denim-deep: #B7CBDC;
    --denim-fill: #29323D;
    --moss: #93B48B;
    --moss-fill: #29352A;
    --ochre: #E3A85F;
    --ochre-fill: #3B2F1C;
    --crisis: #E2897A;
    --crisis-fill: #3B241F;
    --crisis-line: #5C332B;
    --shadow-s: 0 1px 2px rgba(0,0,0,.3);
    --shadow-m: 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  #root { min-height: 100%; display: flex; flex-direction: column; }
  button { font-family: inherit; }
  textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--denim); outline-offset: 2px; border-radius: 4px; }
  a { color: var(--denim); }
  ::selection { background: var(--ochre-fill); }

  .app-shell { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(16px, 4vw, 32px);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
  .brand-mark { width: 20px; height: 20px; flex-shrink: 0; }
  .brand-name { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 1.28rem; letter-spacing: .01em; }
  .topbar-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 999px; border: 1px solid transparent;
    background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 1rem;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--line); color: var(--ink); }
  .mood-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px 6px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink-soft); font-size: .85rem; cursor: pointer;
    box-shadow: var(--shadow-s);
  }
  .mood-chip:hover { border-color: var(--denim); color: var(--ink); }

  /* ---------- Onboarding ---------- */
  .onboard-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .onboard-card {
    max-width: 460px; width: 100%; text-align: center;
  }
  .onboard-mark { width: 44px; height: 44px; margin: 0 auto 18px; }
  .onboard-title { font-family: var(--font-display); font-size: 2.4rem; font-weight: 500; margin: 0 0 6px; }
  .onboard-sub { font-family: var(--font-display); font-style: italic; color: var(--ink-soft); font-size: 1.15rem; margin: 0 0 22px; }
  .onboard-body { color: var(--ink-soft); line-height: 1.6; font-size: .96rem; margin: 0 0 28px; }
  .field-label { display: block; text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 0 0 8px; }
  .name-input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-s); border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink); font-size: .95rem; margin-bottom: 26px;
  }
  .mood-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 30px; }
  .mood-opt {
    padding: 9px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-raised);
    color: var(--ink-soft); font-size: .88rem; cursor: pointer; transition: all .15s ease;
  }
  .mood-opt:hover { border-color: var(--denim); color: var(--ink); }
  .mood-opt.selected { background: var(--denim); border-color: var(--denim); color: #fff; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 26px; border-radius: 999px; border: none; background: var(--denim); color: #fff;
    font-size: .98rem; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-s);
    transition: transform .15s ease, background .15s ease;
  }
  .btn-primary:hover { background: var(--denim-deep); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .crisis-inline {
    margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: .82rem; color: var(--ink-faint); line-height: 1.6;
  }
  .crisis-inline a { font-weight: 600; }

  /* ---------- Chat ---------- */
  .chat-wrap { flex: 1; display: flex; flex-direction: column; max-width: 720px; width: 100%; margin: 0 auto; min-height: 0; }
  .chat-subbar { display: flex; align-items: center; justify-content: space-between; padding: 8px clamp(16px,4vw,32px) 0; }
  .subbar-btn { background: none; border: none; color: var(--ink-faint); font-size: .8rem; cursor: pointer; padding: 6px 4px; }
  .subbar-btn:hover { color: var(--denim); }
  .thread {
    flex: 1; overflow-y: auto; padding: 20px clamp(16px, 4vw, 32px) 10px;
    display: flex; flex-direction: column;
  }
  .stitch { position: relative; padding-left: 20px; }
  .stitch::before {
    content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px;
    background: var(--line);
  }
  .turn { position: relative; margin-bottom: 18px; display: flex; }
  .turn::before {
    content: ''; position: absolute; left: -20px; top: 8px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--line);
  }
  .turn.user::before { border-color: var(--denim); }
  .turn.agent::before { border-color: var(--moss); }
  .turn.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 11px 15px; border-radius: var(--radius-m); line-height: 1.55; font-size: .95rem;
    box-shadow: var(--shadow-s);
  }
  .bubble.user { background: var(--denim); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.agent { background: var(--paper-raised); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .agent-name { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--moss); margin-bottom: 4px; }

  .card { max-width: 88%; border-radius: var(--radius-m); padding: 14px 16px; box-shadow: var(--shadow-s); border: 1px solid var(--line); }
  .card-reframe { background: var(--moss-fill); border-color: color-mix(in srgb, var(--moss) 30%, var(--line)); }
  .card-tool { background: var(--ochre-fill); border-color: color-mix(in srgb, var(--ochre) 30%, var(--line)); }
  .card-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: .84rem; margin: 0 0 6px; color: var(--ink); }
  .card-text { font-size: .92rem; line-height: 1.55; margin: 0; color: var(--ink); }
  .card-actions { display: flex; gap: 8px; margin-top: 11px; }
  .card-actions button {
    font-size: .78rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink-soft); cursor: pointer;
  }
  .card-actions button:hover { border-color: var(--ink-soft); color: var(--ink); }
  .card-actions button.given { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .card-crisis { max-width: 92%; background: var(--crisis-fill); border: 1px solid var(--crisis-line); border-radius: var(--radius-m); padding: 16px 18px; box-shadow: var(--shadow-m); }
  .card-crisis .card-title { color: var(--crisis); font-size: .92rem; }
  .card-crisis p { font-size: .92rem; line-height: 1.6; margin: 0 0 12px; color: var(--ink); }
  .crisis-links { display: flex; flex-direction: column; gap: 7px; }
  .crisis-link {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 13px; border-radius: var(--radius-s); background: var(--paper-raised);
    border: 1px solid var(--crisis-line); color: var(--ink); text-decoration: none; font-size: .87rem;
  }
  .crisis-link strong { font-weight: 700; }
  .crisis-link span.arrow { color: var(--crisis); font-weight: 700; }

  .typing-row { display: flex; align-items: center; gap: 5px; padding: 4px 0 4px 2px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); animation: bounce 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .empty-thread { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink-faint); padding: 40px 20px; }
  .empty-thread p { max-width: 320px; font-size: .92rem; line-height: 1.6; }

  /* ---------- Composer ---------- */
  .composer-wrap { padding: 10px clamp(16px, 4vw, 32px) clamp(14px, 3vw, 22px); border-top: 1px solid var(--line); background: var(--paper); }
  .mic-error { font-size: .78rem; color: var(--crisis); margin: 0 0 8px; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-l);
    padding: 8px 8px 8px 16px; box-shadow: var(--shadow-s);
  }
  .composer textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--ink);
    font-size: .95rem; line-height: 1.5; padding: 8px 0; max-height: 140px;
  }
  .composer textarea::placeholder { color: var(--ink-faint); }
  .mic-btn {
    position: relative; flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .mic-btn:disabled { opacity: .35; cursor: not-allowed; }
  .mic-btn.listening { color: #fff; background: var(--denim); border-color: var(--denim); }
  .mic-ring {
    position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--denim);
    animation: breathe 6.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0% { transform: scale(1); opacity: .6; }
    45% { transform: scale(1.45); opacity: .05; }
    46% { transform: scale(1.45); opacity: 0; }
    100% { transform: scale(1); opacity: .6; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mic-ring { animation: none; opacity: .35; }
    .typing-dot { animation: none; opacity: .8; }
  }
  .send-btn {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--ink); color: var(--paper); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; transition: background .15s ease;
  }
  .send-btn:disabled { opacity: .3; cursor: not-allowed; }
  .safety-note { text-align: center; font-size: .74rem; color: var(--ink-faint); margin: 10px 0 0; }
  .safety-note button { background: none; border: none; color: var(--ink-faint); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; }

  /* ---------- Reflections ---------- */
  .reflections-wrap { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 24px clamp(16px,4vw,32px) 60px; }
  .reflections-wrap h1 { font-family: var(--font-display); font-weight: 500; font-size: 1.9rem; margin: 0 0 4px; }
  .reflections-sub { color: var(--ink-faint); font-size: .88rem; margin: 0 0 28px; }
  .section { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow-s); }
  .section h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 0 0 16px; font-weight: 700; }
  .section-empty { color: var(--ink-faint); font-size: .88rem; line-height: 1.6; }
  .checkin-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .streak { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-soft); }
  .pattern-list, .tools-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .pattern-list li, .tools-list li { display: flex; align-items: baseline; gap: 10px; font-size: .9rem; line-height: 1.55; }
  .pattern-count { font-family: var(--font-mono); font-size: .78rem; color: var(--moss); flex-shrink: 0; min-width: 20px; }
  .tool-rank { font-family: var(--font-mono); font-size: .78rem; color: var(--ochre); flex-shrink: 0; }

  /* ---------- Modals ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,18,15,.42); display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal {
    background: var(--paper-raised); border-radius: var(--radius-l); padding: 26px 26px 22px; max-width: 420px; width: 100%;
    box-shadow: var(--shadow-m); max-height: 86vh; overflow-y: auto;
  }
  .modal h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; margin: 0 0 4px; }
  .modal .modal-close { float: right; background: none; border: none; color: var(--ink-faint); font-size: 1.1rem; cursor: pointer; }
  .mood-scale { display: flex; justify-content: space-between; gap: 6px; margin: 18px 0 4px; }
  .mood-scale button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px;
    border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--paper); cursor: pointer; color: var(--ink-soft);
  }
  .mood-scale button:hover { border-color: var(--denim); color: var(--ink); }
  .mood-scale .emoji { font-size: 1.4rem; }
  .mood-scale .lbl { font-size: .68rem; }
  .info-section { margin-bottom: 16px; }
  .info-section h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); margin: 0 0 6px; }
  .info-section p { font-size: .88rem; line-height: 1.6; color: var(--ink-soft); margin: 0; }

  /* ---------- Mood chart ---------- */
  .chart-wrap { position: relative; }
  .chart-wrap svg { width: 100%; height: auto; overflow: visible; }
  .chart-axis-label { font-size: 9px; fill: var(--ink-faint); font-family: var(--font-body); }
  .chart-point { fill: var(--paper-raised); stroke: var(--moss); stroke-width: 2; }
  .chart-point-last { fill: var(--moss); }

  @media (max-width: 560px) {
    .onboard-title { font-size: 2rem; }
    .bubble, .card { max-width: 92%; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   Conversation engine
   A rule-based, CBT / motivational-interviewing–informed engine.
   No text ever leaves the browser — everything below runs locally.
   ============================================================ */

const EMOTIONS = {
  sadness: { label: 'sadness', words: ['sad','down','depressed','crying','tears','heartbroken','miserable','hurt','grief','grieving'] },
  anxiety: { label: 'anxiety', words: ['anxious','anxiety','worried','worry','panic','nervous','scared','afraid','racing thoughts','on edge','dread'] },
  anger: { label: 'anger', words: ['angry','mad','furious','irritated','resentful','frustrated','pissed','rage'] },
  stress: { label: 'stress', words: ['stressed','stress','burnt out','burned out','exhausted','overworked','behind','deadline','overwhelmed','too much','swamped'] },
  guilt: { label: 'guilt', words: ['guilty','ashamed','shame','my fault','failure','let everyone down','embarrassed'] },
  numb: { label: 'numbness', words: ['numb','empty','flat',"don't care","can't feel",'nothing matters','disconnected'] },
  lonely: { label: 'loneliness', words: ['lonely','alone','isolated','no one','nobody understands','left out'] },
  okay: { label: 'steadiness', words: ['okay','fine','alright','good','better','calm','peaceful','grateful','proud'] }
};

const DISTORTIONS = [
  { key: 'allOrNothing', name: 'all-or-nothing thinking',
    patterns: [/\balways\b/i, /\bnever\b/i, /\beveryone\b/i, /\bno ?one\b/i, /\bcompletely (ruined|failed|useless)\b/i, /\btotal(ly)? (failure|disaster)\b/i],
    reflect: "I noticed some black-and-white language in there — a word like \"always\" or \"never.\"",
    reframe: "Rarely is anything 100% one way. Is there an exception, even a small one, to that always or never?" },
  { key: 'catastrophizing', name: 'catastrophizing',
    patterns: [/\bdisaster\b/i, /\bruined\b/i, /\bthe worst\b/i, /\bcan'?t handle\b/i, /\bcatastrophe\b/i, /\bfalling apart\b/i],
    reflect: "It sounds like your mind jumped straight to the worst-case version of this.",
    reframe: "If a friend told you this happened to them, would you call it a disaster — or a hard day?" },
  { key: 'shouldStatements', name: 'a "should" statement',
    patterns: [/\bi should(n'?t)? have\b/i, /\bi should\b/i, /\bi have to\b/i, /\bi must\b/i, /\bsupposed to\b/i],
    reflect: "I'm hearing a strict rule for yourself in there — a \"should\" or a \"have to.\"",
    reframe: "Where did that rule come from? Would you hold someone you love to it this strictly?" },
  { key: 'mindReading', name: 'mind reading',
    patterns: [/\bthey think\b/i, /\bthey probably\b/i, /\beveryone thinks\b/i, /\bhe (hates|thinks)\b/i, /\bshe (hates|thinks)\b/i, /\bthey hate me\b/i, /\bthey must think\b/i],
    reflect: "It sounds like you might be guessing at what someone else is thinking.",
    reframe: "What's the actual evidence for that — something they said or did, not just a feeling?" },
  { key: 'labeling', name: 'a harsh label',
    patterns: [/\bi'?m (such a |such an )?(failure|loser|mess|idiot|disaster)\b/i, /\bi'?m stupid\b/i, /\bi'?m worthless\b/i, /\bi'?m broken\b/i, /\bi'?m pathetic\b/i],
    reflect: "That's a heavy label to put on all of yourself over one thing.",
    reframe: "Would you describe a friend that harshly for the same mistake? What would you call it instead?" },
  { key: 'personalization', name: 'personalization',
    patterns: [/\bmy fault\b/i, /\bbecause of me\b/i, /\bi ruined\b/i, /\bi caused\b/i, /\bif i had(n'?t)?\b/i],
    reflect: "You're carrying a lot of the blame for this yourself.",
    reframe: "What parts of this were actually in your control, and what parts genuinely weren't?" },
  { key: 'fortuneTelling', name: 'fortune telling',
    patterns: [/\bit'?s going to fail\b/i, /\bnothing (will|ever) (change|work)\b/i, /\bwon'?t get better\b/i, /\bnever going to\b/i, /\bpointless\b/i],
    reflect: "It sounds like you're predicting how this ends before it's actually played out.",
    reframe: "What's one version of how this could go that isn't the worst case?" }
];

// Kept broad on purpose: for crisis language, a false positive (showing
// resources unnecessarily) is a far smaller cost than a missed one.
const CRISIS_PATTERNS = [
  /\bkill(ing)? myself\b/i, /\bend(ing)? my life\b/i, /\bsuicid\w*\b/i,
  /\bwant(ed)? to die\b/i, /\bdon'?t want to (be alive|live|wake up)\b/i, /\bno reason to live\b/i,
  /\bbetter off dead\b/i, /\bbetter off without me\b/i, /\bhurt(ing)? myself\b/i, /\bharm(ing)? myself\b/i,
  /\bself[- ]?harm\b/i, /\bcutting myself\b/i, /\bcan'?t (go on|do this anymore)\b/i, /\bplan to (die|kill)\b/i,
  /\bgoodbye forever\b/i, /\bending it all\b/i, /\bending it\b/i, /\bnot (worth|going to be) around\b/i,
  /\btake my (own )?life\b/i, /\boverdose\b/i, /\bwish i (was|were) dead\b/i, /\bhurt (someone|him|her|them)\b/i,
  /\bi'?m going to kill\b/i
];

const QUESTIONS = {
  sadness: ["What's the heaviest part of this to sit with right now?", "How long has this feeling been building?", "Is there anyone in your corner you've been able to tell this to?"],
  anxiety: ["What's the worry your mind keeps circling back to?", "If that worry actually came true, what would you do next?", "Where do you notice this in your body right now?"],
  anger: ["What do you think is underneath the anger — hurt, fear, something else?", "What would feel fair here?", "What is this anger telling you that you need?"],
  stress: ["If you could put down just one thing on your plate today, what would it be?", "What's actually urgent here, versus what just feels urgent?", "What would 'enough for today' look like?"],
  guilt: ["What would you say to a friend who felt this guilty over the same thing?", "What part of this was actually your choice?", "What would it take to forgive yourself a little here?"],
  numb: ["When did you last feel something different than this, even briefly?", "Is numb maybe protecting you from something bigger right now?", "What's one small thing that usually helps you feel present?"],
  lonely: ["Who's someone you've felt closest to, even a little, this year?", "What does connection look like for you when it's working?", "Is there a small reach-out you could make today, even a short one?"],
  okay: ["What's been going right lately?", "What's helped you feel steady?", "Anything you want to keep an eye on, even if today's okay?"]
};
const GENERIC_QUESTIONS = ["What feels most important to say next?", "What's been sitting with you today?", "Is there more to that you want to say?"];

const TOOLS = {
  breathing: { label: 'Box breathing', icon: '🫁', text: "Try this for four rounds: breathe in for 4 counts, hold for 4, out for 4, hold for 4." },
  grounding: { label: '5-4-3-2-1 grounding', icon: '🌿', text: "Name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, and 1 you can taste." },
  journaling: { label: 'A page to yourself', icon: '📝', text: "Try writing for 5 minutes without stopping — don't worry about it making sense." },
  activation: { label: 'One small step', icon: '🌱', text: "What's the smallest possible version of the thing you're avoiding? Could you do just that piece?" },
  bodyReset: { label: 'Body reset', icon: '💧', text: "Stand up, roll your shoulders, drink some water, unclench your jaw — small resets add up." },
  selfCompassion: { label: 'A kinder voice', icon: '💛', text: "Try a hand on your chest and saying: \"this is hard right now, and that's okay — I'm doing my best.\"" }
};

const EMOTION_OPENERS = {
  sadness: ["That sounds like it really hurts.", "I can hear how much weight that's carrying.", "That's a lot to feel."],
  anxiety: ["That sounds like a lot of worry to be holding.", "I can hear how on edge that's made you.", "That sounds unsettling to sit with."],
  anger: ["That sounds really frustrating.", "I can hear how much that's grating on you.", "That sounds like it crossed a line for you."],
  stress: ["That sounds like a lot to carry at once.", "I can hear how stretched thin you're feeling.", "That sounds exhausting."],
  guilt: ["That sounds like a heavy thing to carry.", "I can hear how much that's weighing on you."],
  numb: ["Thanks for naming that, even flat can be hard to describe.", "That sounds like a hard place to be sitting."],
  lonely: ["That sounds like a lonely place to be.", "I can hear how isolating that feels."],
  okay: ["Good to hear.", "I'm glad that's where things are right now.", "Thanks for sharing that."]
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function weightedPick(weightMap, keys) {
  const weights = keys.map(k => (weightMap && weightMap[k]) || 1);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < keys.length; i++) { r -= weights[i]; if (r <= 0) return keys[i]; }
  return keys[keys.length - 1];
}

function analyze(text) {
  const lower = text.toLowerCase();
  const crisis = CRISIS_PATTERNS.some(p => p.test(lower));
  const distortion = DISTORTIONS.find(d => d.patterns.some(p => p.test(lower))) || null;
  let emotion = null, bestScore = 0;
  Object.entries(EMOTIONS).forEach(([key, def]) => {
    const score = def.words.reduce((s, w) => s + (lower.includes(w) ? 1 : 0), 0);
    if (score > bestScore) { bestScore = score; emotion = key; }
  });
  return { crisis, distortion, emotion };
}

function buildResponse(userText, weights, turnCount) {
  const { crisis, distortion, emotion } = analyze(userText);
  if (crisis) return { type: 'crisis' };

  const opener = distortion ? distortion.reflect : (emotion ? pick(EMOTION_OPENERS[emotion]) : "Thank you for telling me that.");
  const reframe = distortion ? { key: distortion.key, name: distortion.name, text: distortion.reframe } : null;
  const qBank = (emotion && QUESTIONS[emotion]) || GENERIC_QUESTIONS;
  const question = pick(qBank);

  const heavy = emotion && ['sadness', 'anxiety', 'stress', 'lonely', 'guilt'].includes(emotion);
  const offerTool = (turnCount > 0 && turnCount % 3 === 0) || (heavy && turnCount > 0 && turnCount % 2 === 0);
  let tool = null;
  if (offerTool) {
    const toolKey = weightedPick(weights, Object.keys(TOOLS));
    tool = { key: toolKey, ...TOOLS[toolKey] };
  }
  return { type: 'reflect', opener, reframe, question, tool, emotion, distortionKey: distortion ? distortion.key : null };
}

/* ============================================================
   Voice input (Web Speech API)
   ============================================================ */

function useVoiceInput(onResult) {
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const [error, setError] = useState(null);
  const recRef = useRef(null);
  const onResultRef = useRef(onResult);
  onResultRef.current = onResult;

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      onResultRef.current(final || interim, !!final);
    };
    rec.onend = () => setListening(false);
    rec.onerror = (e) => { setListening(false); setError(e.error || 'error'); };
    recRef.current = rec;
    return () => { try { rec.stop(); } catch (e) {} };
  }, []);

  const start = useCallback(() => {
    if (recRef.current && !listening) {
      setError(null);
      try { recRef.current.start(); setListening(true); } catch (e) {}
    }
  }, [listening]);
  const stop = useCallback(() => {
    if (recRef.current && listening) recRef.current.stop();
  }, [listening]);

  return { listening, supported, error, start, stop };
}

/* ============================================================
   Mood chart (SVG, no chart library)
   ============================================================ */

function MoodChart({ entries }) {
  const data = entries.slice(-14);
  const W = 560, H = 150, padX = 14, padY = 20;
  const stepX = data.length > 1 ? (W - padX * 2) / (data.length - 1) : 0;
  const yFor = (v) => H - padY - ((v - 1) / 4) * (H - padY * 2);
  const points = data.map((d, i) => ({ x: padX + i * stepX, y: yFor(d.value), ...d }));
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');

  if (data.length === 0) return null;

  return (
    <div className="chart-wrap">
      <svg viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="xMidYMid meet">
        <line x1={padX} y1={yFor(5)} x2={W - padX} y2={yFor(5)} stroke="var(--line)" strokeWidth="1" />
        <line x1={padX} y1={yFor(1)} x2={W - padX} y2={yFor(1)} stroke="var(--line)" strokeWidth="1" />
        <text x={padX} y={yFor(5) - 6} className="chart-axis-label">great</text>
        <text x={padX} y={yFor(1) + 12} className="chart-axis-label">rough</text>
        {data.length > 1 && <path d={path} fill="none" stroke="var(--moss)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
        {points.map((p, i) => {
          const isLast = i === points.length - 1;
          return (
            <g key={i}>
              <circle cx={p.x} cy={p.y} r="9" fill="transparent">
                <title>{formatDay(p.t) + ' — ' + moodMeta(p.value).label + ' (' + p.value + '/5)'}</title>
              </circle>
              <circle cx={p.x} cy={p.y} r={isLast ? 5 : 3.5} className={isLast ? 'chart-point-last' : 'chart-point'} />
              {isLast && <text x={p.x} y={p.y - 12} textAnchor="end" className="chart-axis-label" style={{ fontWeight: 700, fill: 'var(--moss)' }}>{moodMeta(p.value).label}</text>}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [messages, typing]);

  const recordDistortion = (key) => {
    if (!key) return;
    setPersisted(p => {
      const counts = { ...(p.distortionCounts || {}) };
      counts[key] = (counts[key] || 0) + 1;
      const next = { ...p, distortionCounts: counts };
      saveState(next);
      return next;
    });
  };

  const recordToolFeedback = (toolKey, positive) => {
    setPersisted(p => {
      const weights = { ...(p.weights.coping || {}) };
      const cur = weights[toolKey] || 1;
      weights[toolKey] = clamp(cur * (positive ? 1.15 : 0.85), 0.3, 4);
      const fb = { ...(p.toolFeedback || {}) };
      const cur2 = fb[toolKey] || { helped: 0, notNow: 0 };
      fb[toolKey] = positive ? { ...cur2, helped: cur2.helped + 1 } : { ...cur2, notNow: cur2.notNow + 1 };
      const next = { ...p, weights: { ...p.weights, coping: weights }, toolFeedback: fb };
      saveState(next);
      return next;
    });
  };

  const setMessageFeedback = (id, value) => {
    setMessages(ms => ms.map(m => (m.id === id ? { ...m, feedback: value } : m)));
  };

  const appendAgentTurn = (result) => {
    if (result.type === 'crisis') {
      setMessages(ms => [...ms, { id: uid(), role: 'crisis' }]);
      return;
    }
    setMessages(ms => {
      const additions = [{ id: uid(), role: 'agent', text: result.opener + (result.question ? ' ' + result.question : '') }];
      if (result.reframe) additions.push({ id: uid(), role: 'reframe', reframe: result.reframe });
      if (result.tool) additions.push({ id: uid(), role: 'tool', tool: result.tool });
      return [...ms, ...additions];
    });
    if (result.distortionKey) recordDistortion(result.distortionKey);
  };

  const handleSend = () => {
    const text = draft.trim();
    if (!text) return;
    setMessages(ms => [...ms, { id: uid(), role: 'user', text }]);
    setDraft('');
    if (textareaRef.current) textareaRef.current.style.height = 'auto';
    const result = buildResponse(text, persisted.weights.coping, turnCount);
    setTurnCount(t => t + 1);
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      appendAgentTurn(result);
    }, 550 + Math.random() * 500);
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  };

  const handleMicClick = () => {
    if (voice.listening) voice.stop(); else voice.start();
  };

  const newConversation = () => { setMessages([]); setTurnCount(0); };

  return (
    <div className="chat-wrap">
      <div className="chat-subbar">
        <button className="subbar-btn" onClick={newConversation}>Start fresh</button>
        <button className="subbar-btn" onClick={onOpenReflections}><ChartIcon /> Reflections</button>
      </div>

      <div className="thread stitch" ref={threadRef}>
        {messages.length === 0 && (
          <div className="empty-thread">
            <p>Say whatever's on your mind — typed or spoken. Haven will listen, ask a question or two, and
            offer something to try if it seems useful.</p>
          </div>
        )}
        {messages.map(m => {
          if (m.role === 'user') return <div key={m.id} className="turn user"><div className="bubble user">{m.text}</div></div>;
          if (m.role === 'agent') return <AgentBubble key={m.id}>{m.text}</AgentBubble>;
          if (m.role === 'reframe') return <ReframeCard key={m.id} reframe={m.reframe} />;
          if (m.role === 'tool') return <ToolCard key={m.id} tool={m.tool} feedback={m.feedback} onFeedback={(v) => { setMessageFeedback(m.id, v); recordToolFeedback(m.tool.key, v === 'helped'); }} />;
          if (m.role === 'crisis') return <CrisisCard key={m.id} />;
          return null;
        })}
        {typing && (
          <div className="turn agent">
            <div className="bubble agent typing-row">
              <span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span>
            </div>
          </div>
        )}
      </div>

      <div className="composer-wrap">
        {voice.error === 'not-allowed' && <p className="mic-error">Microphone access was blocked — you can still type.</p>}
        <div className="composer">
          <textarea
            ref={textareaRef}
            rows={1}
            value={draft}
            placeholder={voice.listening ? 'Listening…' : "Type how you're feeling…"}
            onChange={e => { setDraft(e.target.value); e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; }}
            onKeyDown={handleKeyDown}
          />
          {voice.supported && (
            <button className={'mic-btn' + (voice.listening ? ' listening' : '')} onClick={handleMicClick} aria-label={voice.listening ? 'Stop listening' : 'Speak instead of typing'}>
              {voice.listening && <span className="mic-ring" aria-hidden="true"></span>}
              <MicIcon />
            </button>
          )}
          <button className="send-btn" onClick={handleSend} disabled={!draft.trim()} aria-label="Send">
            <SendIcon />
          </button>
        </div>
        <p className="safety-note">
          Haven is a supportive tool, not a therapist. In crisis? <a href="tel:988">Call or text 988</a> (US). <button onClick={onOpenInfo}>More info</button>
        </p>
      </div>
    </div>
  );
}

/* ============================================================
   Top bar
   ============================================================ */

function TopBar({ theme, onToggleTheme, onOpenInfo, moodToday, onCheckIn, view, onGoChat }) {
  return (
    <div className="topbar">
      <a className="brand" href="#" onClick={e => { e.preventDefault(); onGoChat(); }}>
        <BrandMark className="brand-mark" />
        <span className="brand-name">Haven</span>
      </a>
      <div className="topbar-actions">
        <button className="mood-chip" onClick={onCheckIn}>
          {moodToday ? <React.Fragment>{moodMeta(moodToday.value).emoji} Logged today</React.Fragment> : 'Check in'}
        </button>
        <button className="icon-btn" onClick={onToggleTheme} aria-label="Toggle theme">
          {theme === 'dark' ? <SunIcon /> : <MoonIcon />}
        </button>
        <button className="icon-btn" onClick={onOpenInfo} aria-label="About Haven">
          <InfoIcon />
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */

function App() {
  const [persisted, setPersistedRaw] = useState(loadState());
  const [theme, setTheme] = useState(() => {
    try {
      const stored = localStorage.getItem(THEME_KEY);
      if (stored) return stored;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  });
  const [view, setView] = useState('chat');
  const [showInfo, setShowInfo] = useState(false);
  const [showCheckIn, setShowCheckIn] = useState(false);

  const setPersisted = (updater) => setPersistedRaw(prev => (typeof updater === 'function' ? updater(prev) : updater));

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }, [theme]);

  const handleBegin = (name, mood) => {
    setPersisted(p => {
      const next = {
        ...p,
        onboarded: true,
        name,
        moodLog: [...p.moodLog, { t: Date.now(), value: mood.value }]
      };
      saveState(next);
      return next;
    });
  };

  const handleCheckIn = (value) => {
    setPersisted(p => {
      const next = { ...p, moodLog: [...p.moodLog, { t: Date.now(), value }].slice(-60) };
      saveState(next);
      return next;
    });
    setShowCheckIn(false);
  };

  const todayStr = new Date().toDateString();
  const moodToday = useMemo(() => {
    const todays = persisted.moodLog.filter(m => new Date(m.t).toDateString() === todayStr);
    return todays.length ? todays[todays.length - 1] : null;
  }, [persisted.moodLog]);

  if (!persisted.onboarded) {
    return <Onboarding onBegin={handleBegin} />;
  }

  return (
    <div className="app-shell">
      <TopBar
        theme={theme}
        onToggleTheme={() => setTheme(t => (t === 'dark' ? 'light' : 'dark'))}
        onOpenInfo={() => setShowInfo(true)}
        moodToday={moodToday}
        onCheckIn={() => setShowCheckIn(true)}
        view={view}
        onGoChat={() => setView('chat')}
      />
      {view === 'chat' ? (
        <ChatView
          persisted={persisted}
          setPersisted={setPersisted}
          onOpenReflections={() => setView('reflections')}
          onOpenInfo={() => setShowInfo(true)}
          onCheckIn={() => setShowCheckIn(true)}
          moodToday={moodToday}
        />
      ) : (
        <Reflections state={persisted} onBack={() => setView('chat')} onCheckIn={() => setShowCheckIn(true)} />
      )}
      {showInfo && <InfoModal onClose={() => setShowInfo(false)} />}
      {showCheckIn && <MoodCheckInModal onClose={() => setShowCheckIn(false)} onPick={handleCheckIn} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
