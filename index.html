/* ============================== ONBOARDING ============================== */
const ONBOARD_SLIDES = [
  { icon: "briefcase", title: "Welcome to Kontrak", desc: "The simple way to manage your gigs — clients, jobs, and payments, all in one place." },
  { icon: "camera", title: "Track every job", desc: "Snap progress photos and move jobs through clear stages, from scheduled to paid." },
  { icon: "qr", title: "Get paid fast", desc: "Send automatic invoices and collect payment by QR code or Zelle — no chasing checks." },
];

function Onboarding({ onDone }) {
  const [step, setStep] = useState(0);
  const [setup, setSetup] = useState(false);
  const [name, setName] = useState("");
  const [trade, setTrade] = useState("General Contractor");

  if (setup) {
    return (
      <div className="onboard-screen">
        <div className="content" style={{paddingTop: 40}}>
          <div className="eyebrow" style={{marginBottom:8}}>Quick setup</div>
          <div className="onboard-title" style={{fontSize:"1.3em", textAlign:"left"}}>Tell us about your business</div>
          <div className="onboard-desc" style={{textAlign:"left", margin: "6px 0 24px"}}>This shows up on your invoices and dashboard.</div>
          <div className="form-group">
            <label className="label">Your name</label>
            <input className="input" placeholder="Jordan Reyes" value={name} onChange={e => setName(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="label">Trade</label>
            <select className="select" value={trade} onChange={e => setTrade(e.target.value)}>
              {["General Contractor","Electrician","Plumber","HVAC","Carpenter","Landscaper","Painter","Roofer","Handyman","Other"].map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
        </div>
        <div className="onboard-bottom">
          <button className="btn btn-primary btn-block" onClick={() => onDone({ name: name.trim() || "Jordan Reyes", trade })}>
            Enter Kontrak
          </button>
        </div>
      </div>
    );
  }

  const s = ONBOARD_SLIDES[step];
  return (
    <div className="onboard-screen">
      <div className="onboard-top">
        {step < ONBOARD_SLIDES.length - 1 && (
          <button className="btn btn-ghost btn-sm" onClick={() => setSetup(true)}>Skip</button>
        )}
      </div>
      <div className="onboard-body">
        <div className="onboard-icon"><Icon name={s.icon} size={40} /></div>
        <div className="onboard-title">{s.title}</div>
        <div className="onboard-desc">{s.desc}</div>
        <div className="onboard-dots">
          {ONBOARD_SLIDES.map((_, i) => <div key={i} className={"onboard-dot " + (i === step ? "active" : "")}></div>)}
        </div>
      </div>
      <div className="onboard-bottom">
        <button className="btn btn-primary btn-block" onClick={() => step < ONBOARD_SLIDES.length - 1 ? setStep(step+1) : setSetup(true)}>
          {step < ONBOARD_SLIDES.length - 1 ? "Next" : "Get Started"}
        </button>
      </div>
    </div>
  );
}

/* ============================== DASHBOARD ============================== */
function Dashboard({ profile, jobs, clients, invoices, go, notify }) {
  const [fabOpen, setFabOpen] = useState(false);
  const activeJobs = jobs.filter(j => j.stage !== "paid");
  const outstanding = invoices.filter(i => i.status === "sent" || i.status === "overdue")
    .reduce((s,i) => s + i.items.reduce((a,li)=>a+li.qty*li.rate,0), 0);
  const paidThisMonth = invoices.filter(i => i.status === "paid")
    .reduce((s,i) => s + i.items.reduce((a,li)=>a+li.qty*li.rate,0), 0);

  const hour = new Date().getHours();
  const greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const clientName = (id) => (clients.find(c => c.id === id) || {}).name || "Client";

  return (
    <div>
      <div className="eyebrow">{new Date().toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"})}</div>
      <div className="section-title" style={{marginTop:4, fontSize:"1.15em"}}>{greeting}, {profile.name.split(" ")[0]}</div>

      <div className="stat-grid">
        <div className="stat-card">
          <div className="stat-value">{activeJobs.length}</div>
          <div className="stat-label">Active jobs</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{currency(outstanding)}</div>
          <div className="stat-label">Outstanding</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{currency(paidThisMonth)}</div>
          <div className="stat-label">Paid recently</div>
        </div>
      </div>

      <div className="dash-columns">
        <div>
          <div className="row-between">
            <div className="section-title">Active jobs</div>
            <button className="btn btn-ghost btn-sm" onClick={() => go("jobs")}>See all</button>
          </div>
          {activeJobs.length === 0 && <div className="card" style={{color:"var(--text-tertiary)", fontSize:"0.85em"}}>No active jobs. Create one to get started.</div>}
          {activeJobs.slice(0,3).map(j => (
            <button key={j.id} className="card card-tap" onClick={() => go("jobs", { jobId: j.id })}>
              <div className="row-between">
                <div className="stack" style={{gap:2}}>
                  <div style={{fontWeight:600, fontSize:"0.92em"}}>{j.title}</div>
                  <div style={{fontSize:"0.78em", color:"var(--text-tertiary)"}}>{clientName(j.clientId)}</div>
                </div>
                <Badge stage={j.stage}>{stageLabel(j.stage)}</Badge>
              </div>
              <div className="progress-mini"><div className="progress-mini-fill" style={{width: (stageIndex(j.stage)/(STAGES.length-1))*100 + "%"}}></div></div>
            </button>
          ))}
        </div>

        <div>
          <div className="row-between">
            <div className="section-title">Recent invoices</div>
            <button className="btn btn-ghost btn-sm" onClick={() => go("pay")}>See all</button>
          </div>
          {invoices.slice(0,3).map(inv => {
            const total = inv.items.reduce((a,li)=>a+li.qty*li.rate,0);
            return (
              <button key={inv.id} className="card card-tap" onClick={() => go("pay", { invoiceId: inv.id })}>
                <div className="row-between">
                  <div className="stack" style={{gap:2}}>
                    <div style={{fontWeight:600, fontSize:"0.88em", fontFamily:"var(--font-mono)"}}>{inv.number}</div>
                    <div style={{fontSize:"0.78em", color:"var(--text-tertiary)"}}>{clientName(inv.clientId)}</div>
                  </div>
                  <div className="stack" style={{alignItems:"flex-end", gap:4}}>
                    <div style={{fontWeight:700, fontSize:"0.9em"}}>{currency(total)}</div>
                    <Badge stage={inv.status}>{invStatusLabel(inv.status)}</Badge>
                  </div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
      <div style={{height: 8}}></div>

      {fabOpen && <div className="fab-backdrop" onClick={()=>setFabOpen(false)}></div>}
      <div className="fab-dial">
        <button className="fab" onClick={()=>setFabOpen(o=>!o)} aria-label="Quick actions" aria-expanded={fabOpen}>
          <Icon name={fabOpen ? "x" : "plus"} size={22} />
        </button>
        {fabOpen && (
          <React.Fragment>
            <button className="fab-menu-item" onClick={() => { setFabOpen(false); go("pay", { newInvoice: true }); }}>
              New Invoice
              <span className="fab-menu-icon"><Icon name="send" size={15}/></span>
            </button>
            <button className="fab-menu-item" onClick={() => { setFabOpen(false); go("jobs", { newJob: true }); }}>
              New Job
              <span className="fab-menu-icon"><Icon name="briefcase" size={15}/></span>
            </button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ============================== CLIENTS ============================== */
function ClientsScreen({ clients, jobs, invoices, go, params, onAddClient, notify }) {
  const [search, setSearch] = useState("");
  const [adding, setAdding] = useState(!!(params && params.newClient));
  const [form, setForm] = useState({ name:"", company:"", phone:"", email:"", address:"" });

  if (params && params.clientId) {
    return <ClientDetail client={clients.find(c=>c.id===params.clientId)} jobs={jobs} invoices={invoices} go={go} />;
  }

  const filtered = clients.filter(c => (c.name + c.company).toLowerCase().includes(search.toLowerCase()));
  const jobsCount = (id) => jobs.filter(j => j.clientId === id).length;
  const totalBilled = (id) => invoices.filter(i => i.clientId === id && i.status === "paid").reduce((s,i)=>s+i.items.reduce((a,li)=>a+li.qty*li.rate,0),0);

  const submit = () => {
    if (!form.name.trim()) return;
    onAddClient({ id: uid("c"), ...form });
    notify("Client added", "check-circle");
    setAdding(false);
    setForm({ name:"", company:"", phone:"", email:"", address:"" });
  };

  return (
    <div>
      <div className="search-bar">
        <Icon name="search" size={16} className="dim" style={{color:"var(--text-tertiary)"}} />
        <input placeholder="Search clients" value={search} onChange={e=>setSearch(e.target.value)} aria-label="Search clients" />
      </div>
      {filtered.length === 0 && (
        <div className="empty-state">
          <div className="icon-btn"><Icon name="users" size={22} /></div>
          <div style={{fontWeight:600, color:"var(--text)"}}>No clients yet</div>
          <div style={{fontSize:"0.82em", marginTop:4}}>Add your first client to start a job.</div>
        </div>
      )}
      <div className="grid-list">
      {filtered.map(c => (
        <button key={c.id} className="card card-tap" onClick={() => go("clients", { clientId: c.id })}>
          <div className="row" style={{gap:12}}>
            <div className="avatar">{initials(c.name)}</div>
            <div className="stack" style={{gap:2, flex:1, minWidth:0}}>
              <div style={{fontWeight:600, fontSize:"0.92em"}}>{c.name}</div>
              <div style={{fontSize:"0.78em", color:"var(--text-tertiary)"}}>{c.company}</div>
            </div>
            <div className="stack" style={{alignItems:"flex-end", gap:2}}>
              <div style={{fontSize:"0.78em", fontWeight:700}}>{jobsCount(c.id)} job{jobsCount(c.id)!==1?"s":""}</div>
              <div style={{fontSize:"0.72em", color:"var(--text-tertiary)"}}>{currency(totalBilled(c.id))} billed</div>
            </div>
            <Icon name="chevron-right" size={16} style={{color:"var(--text-tertiary)"}} />
          </div>
        </button>
      ))}
      </div>

      <button className="fab" onClick={() => setAdding(true)} aria-label="Add client"><Icon name="plus" size={22} /></button>

      {adding && (
        <Sheet title="New client" onClose={() => setAdding(false)}>
          <div className="form-group"><label className="label">Full name</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Jane Kim" /></div>
          <div className="form-group"><label className="label">Company / property</label><input className="input" value={form.company} onChange={e=>setForm({...form,company:e.target.value})} placeholder="Kim Residence" /></div>
          <div className="input-row form-group">
            <div><label className="label">Phone</label><input className="input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="(555) 555-0100" /></div>
            <div><label className="label">Email</label><input className="input" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="jane@email.com" /></div>
          </div>
          <div className="form-group"><label className="label">Address</label><input className="input" value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="123 Main St, City, CA" /></div>
          <button className="btn btn-primary btn-block" onClick={submit}>Add client</button>
        </Sheet>
      )}
    </div>
  );
}

function ClientDetail({ client, jobs, invoices, go }) {
  if (!client) return null;
  const cJobs = jobs.filter(j => j.clientId === client.id);
  const totalBilled = invoices.filter(i => i.clientId === client.id && i.status === "paid").reduce((s,i)=>s+i.items.reduce((a,li)=>a+li.qty*li.rate,0),0);
  return (
    <div className="client-detail-grid">
      <div className="col-main">
        <div className="card" style={{textAlign:"center", padding:"22px 14px"}}>
          <div className="avatar avatar-lg" style={{margin:"0 auto 10px"}}>{initials(client.name)}</div>
          <div style={{fontWeight:700, fontSize:"1.1em", fontFamily:"var(--font-display)"}}>{client.name}</div>
          <div style={{color:"var(--text-tertiary)", fontSize:"0.84em", marginTop:2}}>{client.company}</div>
        </div>

        <div className="card">
          <div className="row" style={{gap:10, padding:"6px 0"}}><Icon name="phone" size={15} style={{color:"var(--text-tertiary)"}}/><span style={{fontSize:"0.86em"}}>{client.phone || "—"}</span></div>
          <div className="row" style={{gap:10, padding:"6px 0"}}><Icon name="mail" size={15} style={{color:"var(--text-tertiary)"}}/><span style={{fontSize:"0.86em"}}>{client.email || "—"}</span></div>
          <div className="row" style={{gap:10, padding:"6px 0"}}><Icon name="map-pin" size={15} style={{color:"var(--text-tertiary)"}}/><span style={{fontSize:"0.86em"}}>{client.address || "—"}</span></div>
        </div>
      </div>

      <div className="col-side">
        <div className="stat-grid" style={{gridTemplateColumns:"1fr 1fr", marginTop:10}}>
          <div className="stat-card"><div className="stat-value">{cJobs.length}</div><div className="stat-label">Total jobs</div></div>
          <div className="stat-card"><div className="stat-value">{currency(totalBilled)}</div><div className="stat-label">Total billed</div></div>
        </div>

        <div className="section-title">Jobs</div>
        <div className="grid-list">
        {cJobs.map(j => (
          <button key={j.id} className="card card-tap" onClick={() => go("jobs", { jobId: j.id })}>
            <div className="row-between">
              <div style={{fontWeight:600, fontSize:"0.9em"}}>{j.title}</div>
              <Badge stage={j.stage}>{stageLabel(j.stage)}</Badge>
            </div>
          </button>
        ))}
        </div>
      </div>
    </div>
  );
}

/* ============================== JOBS ============================== */
const JOB_FILTERS = [{key:"all",label:"All"}, ...STAGES.map(s=>({key:s.key,label:s.label}))];

function JobsScreen({ jobs, clients, invoices, go, params, onAddJob, onUpdateJob, notify }) {
  const [filter, setFilter] = useState("all");
  const [adding, setAdding] = useState(!!(params && params.newJob));

  if (params && params.jobId) {
    return <JobDetail job={jobs.find(j=>j.id===params.jobId)} clients={clients} invoices={invoices} go={go} onUpdateJob={onUpdateJob} notify={notify} />;
  }

  const clientName = (id) => (clients.find(c => c.id === id) || {}).name || "Client";
  const filtered = filter === "all" ? jobs : jobs.filter(j => j.stage === filter);

  return (
    <div>
      <div className="chip-row">
        {JOB_FILTERS.map(f => (
          <button key={f.key} className={"chip " + (filter===f.key ? "active":"")} onClick={()=>setFilter(f.key)}>{f.label}</button>
        ))}
      </div>

      {filtered.length === 0 && (
        <div className="empty-state">
          <div className="icon-btn"><Icon name="briefcase" size={22} /></div>
          <div style={{fontWeight:600, color:"var(--text)"}}>No jobs here</div>
          <div style={{fontSize:"0.82em", marginTop:4}}>Try a different filter or add a new job.</div>
        </div>
      )}

      <div className="grid-list">
      {filtered.map(j => (
        <button key={j.id} className="card card-tap" onClick={() => go("jobs", { jobId: j.id })}>
          <div className="row-between">
            <div className="stack" style={{gap:2, minWidth:0}}>
              <div style={{fontWeight:600, fontSize:"0.92em"}}>{j.title}</div>
              <div style={{fontSize:"0.78em", color:"var(--text-tertiary)"}}>{clientName(j.clientId)} · due {shortDate(j.dueDate)}</div>
            </div>
            <div className="stack" style={{alignItems:"flex-end", gap:4}}>
              <div style={{fontWeight:700, fontSize:"0.88em", fontFamily:"var(--font-mono)"}}>{currency(j.amount)}</div>
              <Badge stage={j.stage}>{stageLabel(j.stage)}</Badge>
            </div>
          </div>
        </button>
      ))}
      </div>

      <button className="fab" onClick={()=>setAdding(true)} aria-label="Add job"><Icon name="plus" size={22} /></button>

      {adding && <NewJobSheet clients={clients} onClose={()=>setAdding(false)} onSave={(j)=>{ onAddJob(j); setAdding(false); notify("Job created", "check-circle"); }} />}
    </div>
  );
}

function NewJobSheet({ clients, onClose, onSave }) {
  const [title, setTitle] = useState("");
  const [clientId, setClientId] = useState(clients[0] ? clients[0].id : "");
  const [address, setAddress] = useState("");
  const [amount, setAmount] = useState("");
  const [dueDate, setDueDate] = useState(addDays(7));
  const [notes, setNotes] = useState("");

  const submit = () => {
    if (!title.trim() || !clientId) return;
    onSave({
      id: uid("j"), clientId, title: title.trim(), address, amount: Number(amount) || 0,
      startDate: todayISO(), dueDate, stage: "scheduled", notes, photos: [], files: []
    });
  };

  return (
    <Sheet title="New job" onClose={onClose}>
      <div className="form-group"><label className="label">Job title</label><input className="input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Kitchen backsplash retile" /></div>
      <div className="form-group">
        <label className="label">Client</label>
        <select className="select" value={clientId} onChange={e=>setClientId(e.target.value)}>
          {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div className="form-group"><label className="label">Job address</label><input className="input" value={address} onChange={e=>setAddress(e.target.value)} placeholder="123 Main St, City, CA" /></div>
      <div className="input-row form-group">
        <div><label className="label">Estimated amount</label><input className="input" type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="2400" /></div>
        <div><label className="label">Due date</label><input className="input" type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} /></div>
      </div>
      <div className="form-group"><label className="label">Notes</label><textarea className="textarea" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Scope, materials, special instructions…" /></div>
      <button className="btn btn-primary btn-block" onClick={submit}>Create job</button>
    </Sheet>
  );
}

function JobDetail({ job, clients, invoices, go, onUpdateJob, notify }) {
  const [stageSheet, setStageSheet] = useState(false);
  const [notes, setNotes] = useState(job ? job.notes : "");
  const [photoPrompt, setPhotoPrompt] = useState(false);
  if (!job) return null;
  const client = clients.find(c => c.id === job.clientId);
  const hasInvoice = invoices.some(i => i.jobId === job.id);

  const setStage = (key) => {
    onUpdateJob(job.id, { stage: key });
    setStageSheet(false);
    notify("Stage updated to " + stageLabel(key), "check-circle");
  };

  const addPhoto = (label) => {
    const g = Math.floor(Math.random() * PHOTO_GRADIENTS.length);
    onUpdateJob(job.id, { photos: [...job.photos, { id: uid("p"), label, g }] });
    setPhotoPrompt(false);
    notify("Photo added", "camera");
  };

  const addFile = () => {
    const names = ["Site-notes.pdf", "Material-list.pdf", "Client-signoff.pdf", "Measurements.pdf"];
    const name = names[Math.floor(Math.random()*names.length)];
    onUpdateJob(job.id, { files: [...job.files, { id: uid("f"), name, size: (Math.round(Math.random()*900)+100)+" KB" }] });
    notify("File attached", "file");
  };

  const saveNotes = () => onUpdateJob(job.id, { notes });

  return (
    <div>
      <div className="stack" style={{gap:4, marginBottom: 14}}>
        <div style={{fontFamily:"var(--font-display)", fontWeight:700, fontSize:"1.15em"}}>{job.title}</div>
        <button className="row" style={{gap:6, background:"none", border:"none", padding:0, color:"var(--text-secondary)", fontSize:"0.84em", width:"fit-content"}}
          onClick={() => go("clients", { clientId: job.clientId })}>
          <Icon name="users" size={13}/> {client ? client.name : "Client"}
        </button>
        <div className="row" style={{gap:6, color:"var(--text-tertiary)", fontSize:"0.8em"}}>
          <Icon name="map-pin" size={13}/> {job.address || "No address"}
        </div>
      </div>

      <div className="job-detail-grid">
        <div className="col-main">
          <div className="row" style={{gap:8, marginBottom: 16}}>
            <div className="card" style={{flex:1, padding:"10px 12px"}}>
              <div style={{fontSize:"0.68em", color:"var(--text-tertiary)", fontWeight:600}}>AMOUNT</div>
              <div style={{fontWeight:700, fontFamily:"var(--font-mono)"}}>{currency(job.amount)}</div>
            </div>
            <div className="card" style={{flex:1, padding:"10px 12px"}}>
              <div style={{fontSize:"0.68em", color:"var(--text-tertiary)", fontWeight:600}}>DUE</div>
              <div style={{fontWeight:700}}>{shortDate(job.dueDate)}</div>
            </div>
          </div>

          <div className="card">
            <Stepper stage={job.stage} />
            <div style={{marginTop: 14, textAlign:"center"}}>
              <div className="stamp"><Icon name={STAGES[stageIndex(job.stage)].icon} size={13}/>{stageLabel(job.stage)}</div>
            </div>
            <button className="btn btn-secondary btn-block" style={{marginTop:14}} onClick={()=>setStageSheet(true)}>Update stage</button>
          </div>

          <div className="section-title">Notes</div>
          <div className="card">
            <textarea className="textarea" value={notes} onChange={e=>setNotes(e.target.value)} onBlur={saveNotes} placeholder="Scope, materials, special instructions…" />
          </div>

          <div style={{marginTop: 16}}>
            {hasInvoice ? (
              <button className="btn btn-secondary btn-block" onClick={() => go("pay")}><Icon name="wallet" size={15}/>View invoice</button>
            ) : (
              <button className="btn btn-primary btn-block" onClick={() => go("pay", { newInvoice: true, jobId: job.id })}>
                <Icon name="send" size={15}/>Create invoice
              </button>
            )}
          </div>
        </div>

        <div className="col-side">
          <div className="row-between">
            <div className="section-title">Photos</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setPhotoPrompt(true)}><Icon name="plus" size={13}/>Add</button>
          </div>
          {job.photos.length === 0 ? (
            <div className="card" style={{color:"var(--text-tertiary)", fontSize:"0.84em"}}>No photos yet. Add before/progress/after shots to document the work.</div>
          ) : (
            <div className="photo-grid">
              {job.photos.map(p => <PhotoTile key={p.id} label={p.label} g={p.g} />)}
            </div>
          )}

          <div className="row-between">
            <div className="section-title">Files</div>
            <button className="btn btn-ghost btn-sm" onClick={addFile}><Icon name="plus" size={13}/>Add</button>
          </div>
          <div className="card" style={{padding: "4px 10px"}}>
            {job.files.length === 0 && <div style={{color:"var(--text-tertiary)", fontSize:"0.84em", padding:"10px 4px"}}>No files attached.</div>}
            {job.files.map(f => (
              <div className="file-row" key={f.id}>
                <div className="file-icon"><Icon name="file" size={16}/></div>
                <div className="stack" style={{gap:1, flex:1}}>
                  <div style={{fontSize:"0.85em", fontWeight:600}}>{f.name}</div>
                  <div style={{fontSize:"0.72em", color:"var(--text-tertiary)"}}>{f.size}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div style={{height:10}}></div>

      {stageSheet && (
        <Sheet title="Update stage" onClose={()=>setStageSheet(false)}>
          <div className="stack" style={{gap:8}}>
            {STAGES.map(s => (
              <button key={s.key} className="card card-tap row-between" onClick={()=>setStage(s.key)}>
                <div className="row" style={{gap:10}}>
                  <Icon name={s.icon} size={16} style={{color: s.key===job.stage ? "var(--accent)":"var(--text-tertiary)"}}/>
                  <span style={{fontWeight:600, fontSize:"0.9em"}}>{s.label}</span>
                </div>
                {s.key === job.stage && <Icon name="check" size={15} style={{color:"var(--accent)"}}/>}
              </button>
            ))}
          </div>
        </Sheet>
      )}

      {photoPrompt && (
        <Sheet title="Add photo" onClose={()=>setPhotoPrompt(false)}>
          <div style={{fontSize:"0.84em", color:"var(--text-secondary)", marginBottom:14}}>Tag this photo so it's easy to find later.</div>
          <div className="stack" style={{gap:8}}>
            {["Before","Progress","After","Proof of completion"].map(label => (
              <button key={label} className="btn btn-secondary btn-block" onClick={()=>addPhoto(label)}>
                <Icon name="camera" size={15}/>{label}
              </button>
            ))}
          </div>
        </Sheet>
      )}
    </div>
  );
}

/* ============================== PAY / INVOICES ============================== */
const INV_FILTERS = [{key:"all",label:"All"},{key:"draft",label:"Draft"},{key:"sent",label:"Sent"},{key:"paid",label:"Paid"},{key:"overdue",label:"Overdue"}];

function PayScreen({ invoices, jobs, clients, profile, go, params, onAddInvoice, onUpdateInvoice, notify }) {
  const [filter, setFilter] = useState("all");
  const [creating, setCreating] = useState(!!(params && params.newInvoice));

  if (params && params.invoiceId) {
    return <InvoiceDetail invoice={invoices.find(i=>i.id===params.invoiceId)} jobs={jobs} clients={clients} profile={profile}
      onUpdateInvoice={onUpdateInvoice} notify={notify} go={go} />;
  }

  const clientName = (id) => (clients.find(c=>c.id===id)||{}).name || "Client";
  const jobTitle = (id) => (jobs.find(j=>j.id===id)||{}).title || "Job";
  const total = (inv) => inv.items.reduce((a,li)=>a+li.qty*li.rate,0);
  const filtered = filter === "all" ? invoices : invoices.filter(i=>i.status===filter);
  const outstanding = invoices.filter(i=>i.status==="sent"||i.status==="overdue").reduce((s,i)=>s+total(i),0);
  const paid = invoices.filter(i=>i.status==="paid").reduce((s,i)=>s+total(i),0);

  return (
    <div>
      <div className="stat-grid" style={{gridTemplateColumns:"1fr 1fr"}}>
        <div className="stat-card"><div className="stat-value">{currency(outstanding)}</div><div className="stat-label">Outstanding</div></div>
        <div className="stat-card"><div className="stat-value">{currency(paid)}</div><div className="stat-label">Collected</div></div>
      </div>

      <div className="chip-row" style={{marginTop:14}}>
        {INV_FILTERS.map(f => <button key={f.key} className={"chip " + (filter===f.key?"active":"")} onClick={()=>setFilter(f.key)}>{f.label}</button>)}
      </div>

      {filtered.length === 0 && (
        <div className="empty-state">
          <div className="icon-btn"><Icon name="wallet" size={22} /></div>
          <div style={{fontWeight:600, color:"var(--text)"}}>No invoices here</div>
          <div style={{fontSize:"0.82em", marginTop:4}}>Create one from a job to get paid faster.</div>
        </div>
      )}

      <div className="grid-list">
      {filtered.map(inv => (
        <div className="ticket" key={inv.id} style={{marginBottom:10}}>
          <button className="card-tap" style={{width:"100%", background:"none", border:"none", textAlign:"left"}} onClick={()=>go("pay",{invoiceId:inv.id})}>
            <div className="ticket-body" style={{paddingBottom:12}}>
              <div className="row-between">
                <div style={{fontFamily:"var(--font-mono)", fontWeight:700, fontSize:"0.86em"}}>{inv.number}</div>
                <Badge stage={inv.status}>{invStatusLabel(inv.status)}</Badge>
              </div>
              <div style={{fontSize:"0.8em", color:"var(--text-tertiary)", marginTop:4}}>{clientName(inv.clientId)} · {jobTitle(inv.jobId)}</div>
              <div className="row-between" style={{marginTop:10}}>
                <div style={{fontSize:"0.74em", color:"var(--text-tertiary)"}}>Due {shortDate(inv.dueDate)}</div>
                <div style={{fontWeight:700, fontFamily:"var(--font-mono)"}}>{currency2(total(inv))}</div>
              </div>
            </div>
          </button>
        </div>
      ))}
      </div>

      <button className="fab" onClick={()=>setCreating(true)} aria-label="New invoice"><Icon name="plus" size={22} /></button>

      {creating && (
        <NewInvoiceFlow jobs={jobs} clients={clients} invoices={invoices} presetJobId={params && params.jobId}
          onClose={()=>setCreating(false)}
          onSave={(inv)=>{ onAddInvoice(inv); setCreating(false); notify("Invoice sent", "send"); go("pay",{invoiceId: inv.id}); }} />
      )}
    </div>
  );
}

function NewInvoiceFlow({ jobs, clients, invoices, presetJobId, onClose, onSave }) {
  const uninvoicedJobs = jobs.filter(j => !invoices.some(i=>i.jobId===j.id));
  const [step, setStep] = useState(1);
  const [jobId, setJobId] = useState(presetJobId || (uninvoicedJobs[0] && uninvoicedJobs[0].id) || "");
  const job = jobs.find(j=>j.id===jobId);
  const client = job ? clients.find(c=>c.id===job.clientId) : null;
  const [items, setItems] = useState([]);
  const [dueDate, setDueDate] = useState(addDays(14));

  useEffect(() => {
    if (job) setItems([{ desc: job.title + " — labor & materials", qty: 1, rate: job.amount || 0 }]);
  }, [jobId]);

  const total = items.reduce((a,li)=>a + (Number(li.qty)||0)*(Number(li.rate)||0), 0);
  const updateItem = (i, key, val) => setItems(items.map((li,idx)=> idx===i ? {...li, [key]: val} : li));
  const addLine = () => setItems([...items, { desc:"", qty:1, rate:0 }]);
  const removeLine = (i) => setItems(items.filter((_,idx)=>idx!==i));

  const submit = () => {
    onSave({
      id: uid("i"), jobId, clientId: job.clientId,
      number: "KTK-" + (1000 + Math.floor(Math.random()*899) + 8),
      dateIssued: todayISO(), dueDate, items, status: "sent"
    });
  };

  return (
    <Sheet title={"New invoice · Step " + step + " of 3"} onClose={onClose}>
      {step === 1 && (
        <div>
          <div className="label" style={{marginBottom:10}}>Select a job to invoice</div>
          {jobs.length === 0 && <div style={{fontSize:"0.85em", color:"var(--text-tertiary)"}}>No jobs yet — create a job first.</div>}
          <div className="stack" style={{gap:8, maxHeight: 320, overflowY:"auto"}}>
            {jobs.map(j => {
              const c = clients.find(x=>x.id===j.clientId);
              return (
                <button key={j.id} className="card card-tap row-between" onClick={()=>setJobId(j.id)}>
                  <div className="stack" style={{gap:2}}>
                    <div style={{fontWeight:600, fontSize:"0.88em"}}>{j.title}</div>
                    <div style={{fontSize:"0.76em", color:"var(--text-tertiary)"}}>{c ? c.name : ""} · {currency(j.amount)}</div>
                  </div>
                  {jobId === j.id && <Icon name="check" size={15} style={{color:"var(--accent)"}}/>}
                </button>
              );
            })}
          </div>
          <button className="btn btn-primary btn-block" style={{marginTop:16}} disabled={!jobId} onClick={()=>setStep(2)}>Continue</button>
        </div>
      )}

      {step === 2 && job && (
        <div>
          <div className="label" style={{marginBottom:8}}>Line items</div>
          {items.map((li, i) => (
            <div className="card" key={i} style={{marginBottom:8}}>
              <input className="input" placeholder="Description" value={li.desc} onChange={e=>updateItem(i,"desc",e.target.value)} style={{marginBottom:8}} />
              <div className="input-row" style={{alignItems:"center"}}>
                <div><label className="label">Qty</label><input className="input" type="number" value={li.qty} onChange={e=>updateItem(i,"qty",e.target.value)} /></div>
                <div><label className="label">Rate</label><input className="input" type="number" value={li.rate} onChange={e=>updateItem(i,"rate",e.target.value)} /></div>
                <button className="icon-btn" style={{marginTop:18}} onClick={()=>removeLine(i)} aria-label="Remove line"><Icon name="trash" size={14}/></button>
              </div>
            </div>
          ))}
          <button className="btn btn-secondary btn-block" onClick={addLine}><Icon name="plus" size={14}/>Add line item</button>
          <div className="form-group" style={{marginTop:14}}>
            <label className="label">Due date</label>
            <input className="input" type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} />
          </div>
          <div className="divider"></div>
          <div className="row-between" style={{fontWeight:700, marginBottom:14}}>
            <span>Total</span><span style={{fontFamily:"var(--font-mono)"}}>{currency2(total)}</span>
          </div>
          <div className="row" style={{gap:8}}>
            <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setStep(1)}>Back</button>
            <button className="btn btn-primary" style={{flex:2}} onClick={()=>setStep(3)}>Review</button>
          </div>
        </div>
      )}

      {step === 3 && job && (
        <div>
          <div className="ticket">
            <div className="ticket-body">
              <div className="row-between">
                <div className="eyebrow">Invoice preview</div>
                <span style={{fontFamily:"var(--font-mono)", fontSize:"0.8em"}}>Due {shortDate(dueDate)}</span>
              </div>
              <div style={{fontWeight:700, fontFamily:"var(--font-display)", fontSize:"1.05em", margin:"6px 0 2px"}}>{client.name}</div>
              <div style={{fontSize:"0.78em", color:"var(--text-tertiary)"}}>{job.title}</div>
              <div className="ticket-dash"></div>
              {items.map((li,i)=>(
                <div className="row-between" key={i} style={{fontSize:"0.82em", marginBottom:6}}>
                  <span style={{color:"var(--text-secondary)"}}>{li.desc || "—"} × {li.qty}</span>
                  <span style={{fontFamily:"var(--font-mono)"}}>{currency2((Number(li.qty)||0)*(Number(li.rate)||0))}</span>
                </div>
              ))}
              <div className="ticket-dash"></div>
              <div className="row-between" style={{fontWeight:700}}>
                <span>Total due</span><span style={{fontFamily:"var(--font-mono)"}}>{currency2(total)}</span>
              </div>
            </div>
          </div>
          <div className="row" style={{gap:8, marginTop:16}}>
            <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setStep(2)}>Back</button>
            <button className="btn btn-primary" style={{flex:2}} onClick={submit}><Icon name="send" size={14}/>Send invoice</button>
          </div>
        </div>
      )}
    </Sheet>
  );
}

function InvoiceDetail({ invoice, jobs, clients, profile, onUpdateInvoice, notify, go }) {
  const [payTab, setPayTab] = useState("qr");
  const qrRef = useRef(null);
  if (!invoice) return null;
  const job = jobs.find(j=>j.id===invoice.jobId);
  const client = clients.find(c=>c.id===invoice.clientId);
  const total = invoice.items.reduce((a,li)=>a+li.qty*li.rate,0);

  useEffect(() => {
    if (payTab === "qr" && qrRef.current && window.QRCode) {
      qrRef.current.innerHTML = "";
      const payload = "zelle:" + (profile.zelle || "you@kontrak.app") + "?amount=" + total + "&memo=" + invoice.number;
      window.QRCode.toCanvas(payload, { width: 148, margin: 0, color: { dark: "#1a1a1a", light: "#ffffff" } }, (err, canvas) => {
        if (!err && qrRef.current) qrRef.current.appendChild(canvas);
      });
    }
  }, [payTab, invoice.id]);

  const markPaid = () => { onUpdateInvoice(invoice.id, { status: "paid", paidDate: todayISO() }); notify("Marked as paid", "check-circle"); };
  const sendInvoice = () => { onUpdateInvoice(invoice.id, { status: "sent" }); notify("Invoice sent", "send"); };
  const remind = () => notify("Reminder sent to " + (client ? client.name : "client"), "bell");

  const buildPDF = () => {
    if (!window.jspdf) return null;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const M = 54, W = 612 - M * 2;
    const ACCENT = "#c1613f", INK = "#22201c", MUTE = "#8a867c", LINE = "#e4e0d4";
    let y = M;

    doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(INK);
    doc.text("KONTRAK", M, y + 6);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(MUTE);
    doc.text((profile.business || profile.name || "").toUpperCase(), M, y + 20);

    doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(ACCENT);
    doc.text("INVOICE", M + W, y + 8, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(MUTE);
    doc.text(invoice.number, M + W, y + 22, { align: "right" });

    y += 40;
    doc.setDrawColor(ACCENT); doc.setLineWidth(2); doc.line(M, y, M + W, y);
    y += 26;

    const colW = W / 2 - 10;
    doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(MUTE);
    doc.text("BILLED TO", M, y);
    doc.text("INVOICE DETAILS", M + colW + 20, y);
    y += 14;

    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(INK);
    doc.text((client && client.name) || "—", M, y);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(MUTE);
    let cy = y + 14;
    if (client && client.address) { doc.text(doc.splitTextToSize(client.address, colW), M, cy); cy += 12; }
    if (client && client.email) { doc.text(client.email, M, cy); cy += 12; }
    if (client && client.phone) { doc.text(client.phone, M, cy); cy += 12; }

    const dCol = M + colW + 20;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(INK);
    doc.text("Job", dCol, y); doc.setTextColor(MUTE); doc.text(job ? job.title : "—", dCol + 70, y);
    doc.setTextColor(INK); doc.text("Issued", dCol, y + 14); doc.setTextColor(MUTE); doc.text(longDate(invoice.dateIssued), dCol + 70, y + 14);
    doc.setTextColor(INK); doc.text("Due", dCol, y + 28); doc.setTextColor(MUTE); doc.text(longDate(invoice.dueDate), dCol + 70, y + 28);
    doc.setTextColor(INK); doc.text("Status", dCol, y + 42); doc.setTextColor(ACCENT); doc.text(invStatusLabel(invoice.status).toUpperCase(), dCol + 70, y + 42);

    y += 70;
    doc.setFillColor(246, 244, 238); doc.rect(M, y, W, 22, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(MUTE);
    doc.text("DESCRIPTION", M + 8, y + 14);
    doc.text("QTY", M + W - 190, y + 14, { align: "right" });
    doc.text("RATE", M + W - 100, y + 14, { align: "right" });
    doc.text("AMOUNT", M + W - 8, y + 14, { align: "right" });
    y += 22;

    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(INK);
    invoice.items.forEach((li, i) => {
      const rowH = 22;
      if (i % 2 === 1) { doc.setFillColor(251, 250, 246); doc.rect(M, y, W, rowH, "F"); }
      doc.setTextColor(INK);
      doc.text(doc.splitTextToSize(li.desc || "—", W - 210), M + 8, y + 14);
      doc.setTextColor(MUTE);
      doc.text(String(li.qty), M + W - 190, y + 14, { align: "right" });
      doc.text(currency2(li.rate), M + W - 100, y + 14, { align: "right" });
      doc.setTextColor(INK);
      doc.text(currency2(li.qty * li.rate), M + W - 8, y + 14, { align: "right" });
      y += rowH;
    });

    y += 6;
    doc.setDrawColor(LINE); doc.setLineWidth(1); doc.line(M, y, M + W, y);
    y += 24;
    doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(INK);
    doc.text("Total due", M, y);
    doc.setFontSize(15); doc.setTextColor(ACCENT);
    doc.text(currency2(total), M + W - 8, y, { align: "right" });

    y += 40;
    doc.setDrawColor(LINE); doc.line(M, y, M + W, y);
    y += 20;
    doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(MUTE);
    doc.text("PAYMENT", M, y);
    y += 14;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(INK);
    doc.text("Zelle: " + (profile.zelle || "—"), M, y);

    if (invoice.status === "paid") {
      doc.setFont("helvetica", "bold"); doc.setFontSize(46); doc.setTextColor(139, 171, 108);
      doc.text("PAID", 306, 380, { align: "center", angle: 18 });
    }

    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(MUTE);
    doc.text("Generated with Kontrak", M, 760);

    return doc;
  };

  const downloadPDF = () => {
    const doc = buildPDF();
    if (!doc) { notify("PDF library unavailable", "alert-circle"); return; }
    doc.save(invoice.number + ".pdf");
    notify("PDF downloaded", "download");
  };

  const emailInvoice = () => {
    const doc = buildPDF();
    if (doc) doc.save(invoice.number + ".pdf");
    const firstName = client && client.name ? client.name.split(" ")[0] : "";
    const subject = "Invoice " + invoice.number + " from " + (profile.business || profile.name);
    const body = "Hi " + firstName + ",\n\nPlease find attached invoice " + invoice.number +
      " for " + (job ? job.title : "your project") + " — total " + currency2(total) +
      ", due " + longDate(invoice.dueDate) + ".\n\nYou can pay via Zelle to " + (profile.zelle || "") +
      ".\n\nThanks,\n" + profile.name;
    const mailto = "mailto:" + encodeURIComponent((client && client.email) || "") +
      "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
    window.open(mailto, "_blank");
    notify("Email draft opened — attach the PDF", "mail");
  };

  return (
    <div className="detail-narrow">
      <div className="ticket">
        <div className="ticket-body">
          <div className="row-between">
            <div>
              <div className="eyebrow">Invoice</div>
              <div style={{fontFamily:"var(--font-mono)", fontWeight:700, fontSize:"1.05em"}}>{invoice.number}</div>
            </div>
            <Badge stage={invoice.status}>{invStatusLabel(invoice.status)}</Badge>
          </div>
          <div className="ticket-dash"></div>
          <div className="row-between" style={{fontSize:"0.82em", marginBottom:6}}>
            <span style={{color:"var(--text-tertiary)"}}>Billed to</span>
            <span style={{fontWeight:600}}>{client ? client.name : "—"}</span>
          </div>
          <div className="row-between" style={{fontSize:"0.82em", marginBottom:6}}>
            <span style={{color:"var(--text-tertiary)"}}>Job</span>
            <span style={{fontWeight:600}}>{job ? job.title : "—"}</span>
          </div>
          <div className="row-between" style={{fontSize:"0.82em"}}>
            <span style={{color:"var(--text-tertiary)"}}>Issued / Due</span>
            <span>{shortDate(invoice.dateIssued)} → {shortDate(invoice.dueDate)}</span>
          </div>
          <div className="ticket-dash"></div>
          {invoice.items.map((li,i)=>(
            <div className="row-between" key={i} style={{fontSize:"0.85em", marginBottom:7}}>
              <span style={{color:"var(--text-secondary)"}}>{li.desc} {li.qty>1 ? "× "+li.qty : ""}</span>
              <span style={{fontFamily:"var(--font-mono)"}}>{currency2(li.qty*li.rate)}</span>
            </div>
          ))}
          <div className="ticket-dash"></div>
          <div className="row-between" style={{fontWeight:700, fontSize:"1.05em"}}>
            <span>Total</span><span style={{fontFamily:"var(--font-mono)"}}>{currency2(total)}</span>
          </div>
        </div>
        <div className="ticket-perf"></div>
      </div>

      <div className="row" style={{gap:8, marginTop:12}}>
        <button className="btn btn-secondary" style={{flex:1}} onClick={downloadPDF}><Icon name="download" size={14}/>Download PDF</button>
        <button className="btn btn-secondary" style={{flex:1}} onClick={emailInvoice}><Icon name="mail" size={14}/>Email invoice</button>
      </div>

      {invoice.status === "draft" && (
        <button className="btn btn-primary btn-block" style={{marginTop:16}} onClick={sendInvoice}><Icon name="send" size={15}/>Send invoice</button>
      )}

      {(invoice.status === "sent" || invoice.status === "overdue") && (
        <div>
          <div className="section-title">Collect payment</div>
          <div className="card">
            <div className="segmented" style={{marginBottom:14}}>
              <button className={payTab==="qr"?"active":""} onClick={()=>setPayTab("qr")}><Icon name="qr" size={13}/> QR code</button>
              <button className={payTab==="zelle"?"active":""} onClick={()=>setPayTab("zelle")}><Icon name="dollar" size={13}/> Zelle</button>
            </div>
            {payTab === "qr" ? (
              <div style={{textAlign:"center"}}>
                <div className="qr-wrap"><div ref={qrRef}></div></div>
                <div style={{fontSize:"0.76em", color:"var(--text-tertiary)", marginTop:10}}>Client scans to pay {currency2(total)} via Zelle</div>
              </div>
            ) : (
              <div style={{textAlign:"center", padding:"10px 0"}}>
                <div style={{fontSize:"0.72em", color:"var(--text-tertiary)", fontWeight:600, marginBottom:4}}>SEND TO</div>
                <div style={{fontFamily:"var(--font-mono)", fontWeight:700, fontSize:"1.05em"}}>{profile.zelle || "you@kontrak.app"}</div>
                <button className="btn btn-secondary btn-sm" style={{marginTop:12}} onClick={()=>notify("Copied to clipboard","copy")}>
                  <Icon name="copy" size={13}/>Copy handle
                </button>
              </div>
            )}
          </div>
          <div className="row" style={{gap:8, marginTop:12}}>
            {invoice.status === "overdue" && <button className="btn btn-secondary" style={{flex:1}} onClick={remind}><Icon name="bell" size={14}/>Remind</button>}
            <button className="btn btn-primary" style={{flex:1}} onClick={markPaid}><Icon name="check" size={14}/>Mark as paid</button>
          </div>
        </div>
      )}

      {invoice.status === "paid" && (
        <div className="card" style={{textAlign:"center", marginTop:16}}>
          <div className="icon-btn" style={{width:48,height:48,margin:"0 auto 10px", color:"var(--success)", background:"var(--success-soft)"}}><Icon name="check-circle" size={22}/></div>
          <div style={{fontWeight:700}}>Payment received</div>
          <div style={{fontSize:"0.8em", color:"var(--text-tertiary)", marginTop:2}}>Paid on {longDate(invoice.paidDate)}</div>
        </div>
      )}
      <div style={{height:10}}></div>
    </div>
  );
}

/* ============================== SETTINGS ============================== */
function SettingsScreen({ profile, setProfile, theme, setTheme, fontSize, setFontSize, notify, onReset }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState(profile);
  const [notifOn, setNotifOn] = useState(true);
  const [confirmReset, setConfirmReset] = useState(false);

  const saveProfile = () => { setProfile(form); setEditing(false); notify("Profile updated", "check-circle"); };

  return (
    <div>
      <div className="card" style={{textAlign:"center", padding:"22px 14px"}}>
        <div className="avatar avatar-lg" style={{margin:"0 auto 10px"}}>{initials(profile.name)}</div>
        <div style={{fontWeight:700, fontSize:"1.05em"}}>{profile.name}</div>
        <div style={{color:"var(--text-tertiary)", fontSize:"0.82em"}}>{profile.trade}</div>
        <button className="btn btn-secondary btn-sm" style={{marginTop:12}} onClick={()=>{setForm(profile); setEditing(true);}}><Icon name="edit" size={13}/>Edit profile</button>
      </div>

      <div className="section-title">Business & payments</div>
      <div className="card">
        <div className="setting-row">
          <div className="setting-row-text"><div className="setting-row-title">Business name</div><div className="setting-row-sub">{profile.business || "Not set"}</div></div>
        </div>
        <div className="setting-row">
          <div className="setting-row-text"><div className="setting-row-title">Zelle handle</div><div className="setting-row-sub">{profile.zelle || "Not set"}</div></div>
          <button className="icon-btn" onClick={()=>{setForm(profile); setEditing(true);}} aria-label="Edit"><Icon name="edit" size={13}/></button>
        </div>
      </div>

      <div className="section-title">Appearance</div>
      <div className="card">
        <div className="setting-row">
          <div className="setting-row-text">
            <div className="setting-row-title">Theme</div>
            <div className="setting-row-sub">Choose light or dark mode</div>
          </div>
        </div>
        <div className="segmented" style={{marginTop:2, marginBottom:14}}>
          <button className={theme==="dark"?"active":""} onClick={()=>setTheme("dark")}><Icon name="moon" size={13}/> Dark</button>
          <button className={theme==="light"?"active":""} onClick={()=>setTheme("light")}><Icon name="sun" size={13}/> Light</button>
        </div>
        <div className="setting-row">
          <div className="setting-row-text">
            <div className="setting-row-title">Text size</div>
            <div className="setting-row-sub">Adjust for comfortable reading</div>
          </div>
        </div>
        <div className="segmented" style={{marginTop:2}}>
          <button className={fontSize==="sm"?"active":""} onClick={()=>setFontSize("sm")}>Small</button>
          <button className={fontSize==="md"?"active":""} onClick={()=>setFontSize("md")}>Medium</button>
          <button className={fontSize==="lg"?"active":""} onClick={()=>setFontSize("lg")}>Large</button>
        </div>
      </div>

      <div className="section-title">Notifications</div>
      <div className="card">
        <div className="setting-row">
          <div className="setting-row-text"><div className="setting-row-title">Job & invoice reminders</div><div className="setting-row-sub">Due dates and payment status</div></div>
          <button className={"switch " + (notifOn?"on":"")} onClick={()=>setNotifOn(!notifOn)} aria-label="Toggle notifications"><div className="switch-knob"></div></button>
        </div>
      </div>

      <div className="section-title">Data</div>
      <div className="card">
        <div className="setting-row">
          <div className="setting-row-text"><div className="setting-row-title">Reset app data</div><div className="setting-row-sub">Clears clients, jobs, and invoices</div></div>
          <button className="btn btn-danger btn-sm" onClick={()=>setConfirmReset(true)}>Reset</button>
        </div>
      </div>

      <div style={{textAlign:"center", marginTop:22, color:"var(--text-tertiary)", fontSize:"0.76em"}}>
        <span className="wordmark" style={{fontSize:"1.1em", color:"var(--text-secondary)"}}>Kontrak</span><br/>
        Version 1.0 · Prototype
      </div>
      <div style={{height:16}}></div>

      {editing && (
        <Sheet title="Edit profile" onClose={()=>setEditing(false)}>
          <div className="form-group"><label className="label">Your name</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} /></div>
          <div className="form-group">
            <label className="label">Trade</label>
            <select className="select" value={form.trade} onChange={e=>setForm({...form,trade:e.target.value})}>
              {["General Contractor","Electrician","Plumber","HVAC","Carpenter","Landscaper","Painter","Roofer","Handyman","Other"].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">Business name</label><input className="input" value={form.business||""} onChange={e=>setForm({...form,business:e.target.value})} placeholder="Reyes Contracting Co." /></div>
          <div className="form-group"><label className="label">Zelle handle (email or phone)</label><input className="input" value={form.zelle||""} onChange={e=>setForm({...form,zelle:e.target.value})} placeholder="you@email.com" /></div>
          <button className="btn btn-primary btn-block" onClick={saveProfile}>Save changes</button>
        </Sheet>
      )}

      {confirmReset && (
        <Sheet title="Reset app data?" onClose={()=>setConfirmReset(false)}>
          <div style={{fontSize:"0.88em", color:"var(--text-secondary)", marginBottom:18}}>
            This permanently clears all clients, jobs, and invoices on this device. This can't be undone.
          </div>
          <div className="row" style={{gap:8}}>
            <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setConfirmReset(false)}>Cancel</button>
            <button className="btn btn-danger" style={{flex:1}} onClick={()=>{onReset(); setConfirmReset(false);}}>Reset data</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

/* ============================== APP ============================== */
const TABS = [
  { key: "home", label: "Home", icon: "home" },
  { key: "clients", label: "Clients", icon: "users" },
  { key: "jobs", label: "Jobs", icon: "briefcase" },
  { key: "pay", label: "Pay", icon: "wallet" },
  { key: "settings", label: "Settings", icon: "sliders" },
];

function App() {
  const [ready, setReady] = useState(false);
  const [onboarded, setOnboarded] = useState(false);
  const [profile, setProfile] = useState({ name: "Jordan Reyes", trade: "General Contractor", business: "Reyes Contracting Co.", zelle: "jordan@reyescontracting.com" });
  const [theme, setTheme] = useState("dark");
  const [fontSize, setFontSize] = useState("md");
  const [data, setData] = useState(seedData());
  const [tab, setTab] = useState("home");
  const [params, setParams] = useState({});
  const [toasts, setToasts] = useState([]);

  // Load persisted state once
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("kontrak-app-state", false);
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          if (saved.profile) setProfile(saved.profile);
          if (saved.theme) setTheme(saved.theme);
          if (saved.fontSize) setFontSize(saved.fontSize);
          if (saved.data) setData(saved.data);
          if (saved.onboarded) setOnboarded(true);
        }
      } catch (e) { /* no saved state yet */ }
      setReady(true);
    })();
  }, []);

  // Persist on change (debounced)
  useEffect(() => {
    if (!ready) return;
    const t = setTimeout(async () => {
      try {
        await window.storage.set("kontrak-app-state", JSON.stringify({ profile, theme, fontSize, data, onboarded }), false);
      } catch (e) { /* best effort */ }
    }, 600);
    return () => clearTimeout(t);
  }, [profile, theme, fontSize, data, onboarded, ready]);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.style.setProperty("--fs-scale", fontSize === "sm" ? "0.9" : fontSize === "lg" ? "1.15" : "1");
  }, [theme, fontSize]);

  const notify = useCallback((msg, icon) => {
    const id = uid("t");
    setToasts(ts => [...ts, { id, msg, icon }]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 2600);
  }, []);

  const go = useCallback((t, p = {}) => { setTab(t); setParams(p); }, []);
  const switchTab = (t) => { setTab(t); setParams({}); };

  const addClient = (c) => setData(d => ({ ...d, clients: [...d.clients, c] }));
  const addJob = (j) => setData(d => ({ ...d, jobs: [...d.jobs, j] }));
  const updateJob = (id, patch) => setData(d => ({ ...d, jobs: d.jobs.map(j => j.id === id ? { ...j, ...patch } : j) }));
  const addInvoice = (i) => setData(d => ({ ...d, invoices: [...d.invoices, i] }));
  const updateInvoice = (id, patch) => setData(d => ({ ...d, invoices: d.invoices.map(i => i.id === id ? { ...i, ...patch } : i) }));
  const resetData = () => { const fresh = seedData(); setData(fresh); notify("App data reset", "check-circle"); };

  if (!ready) return <div className="app-shell"><div className="device"></div></div>;

  if (!onboarded) {
    return (
      <div className="app-shell">
        <div className="device" data-theme={theme}>
          <Onboarding onDone={(p) => { setProfile(pr => ({...pr, ...p})); setOnboarded(true); }} />
        </div>
      </div>
    );
  }

  const titles = {
    home: { title: "Kontrak", sub: null },
    clients: { title: params.clientId ? (data.clients.find(c=>c.id===params.clientId)||{}).name : "Clients", sub: params.clientId ? null : (data.clients.length + " total") },
    jobs: { title: params.jobId ? "Job details" : "Jobs", sub: params.jobId ? null : (data.jobs.length + " total") },
    pay: { title: params.invoiceId ? (data.invoices.find(i=>i.id===params.invoiceId)||{}).number : "Pay", sub: params.invoiceId ? null : (data.invoices.length + " invoices") },
    settings: { title: "Settings", sub: null },
  };
  const hasDetail = (tab === "clients" && params.clientId) || (tab === "jobs" && params.jobId) || (tab === "pay" && params.invoiceId);

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="sidebar-brand"><span className="wordmark">Kontrak</span></div>
        <nav className="sidebar-nav">
          {TABS.filter(t => t.key !== "settings").map(t => (
            <button key={t.key} className={"sidebar-item " + (tab===t.key?"active":"")} onClick={()=>switchTab(t.key)}>
              <Icon name={t.icon} size={17}/>
              <span>{t.label}</span>
            </button>
          ))}
        </nav>
        <button className="sidebar-profile" onClick={()=>switchTab("settings")}>
          <div className="avatar avatar-sm">{initials(profile.name)}</div>
          <div className="stack" style={{gap:0, alignItems:"flex-start", minWidth:0}}>
            <span style={{fontSize:"0.82em", fontWeight:600, whiteSpace:"nowrap"}}>{profile.name}</span>
            <span style={{fontSize:"0.7em", color:"var(--text-tertiary)"}}>{profile.trade}</span>
          </div>
          <Icon name="sliders" size={14} style={{marginLeft:"auto", color: tab==="settings" ? "var(--accent)" : "var(--text-tertiary)"}}/>
        </button>
      </aside>

      <div className="device">
        <TopBar
          title={tab === "home" ? (<span className="row" style={{gap:8}}><span className="wordmark">Kontrak</span></span>) : titles[tab].title}
          sub={titles[tab].sub}
          onBack={hasDetail ? () => setParams({}) : null}
          right={
            <React.Fragment>
              <button className="btn btn-primary btn-sm header-new-job-btn" onClick={() => go("jobs", { newJob: true })}>
                <Icon name="plus" size={13}/>New job
              </button>
              {tab === "home" && <button className="icon-btn" onClick={()=>switchTab("settings")} aria-label="Settings"><Icon name="sliders" size={16}/></button>}
            </React.Fragment>
          }
        />
        <div className="content">
          {tab === "home" && <Dashboard profile={profile} jobs={data.jobs} clients={data.clients} invoices={data.invoices} go={go} notify={notify} />}
          {tab === "clients" && <ClientsScreen clients={data.clients} jobs={data.jobs} invoices={data.invoices} go={go} params={params} onAddClient={addClient} notify={notify} />}
          {tab === "jobs" && <JobsScreen jobs={data.jobs} clients={data.clients} invoices={data.invoices} go={go} params={params} onAddJob={addJob} onUpdateJob={updateJob} notify={notify} />}
          {tab === "pay" && <PayScreen invoices={data.invoices} jobs={data.jobs} clients={data.clients} profile={profile} go={go} params={params} onAddInvoice={addInvoice} onUpdateInvoice={updateInvoice} notify={notify} />}
          {tab === "settings" && <SettingsScreen profile={profile} setProfile={setProfile} theme={theme} setTheme={setTheme} fontSize={fontSize} setFontSize={setFontSize} notify={notify} onReset={resetData} />}
        </div>

        <Toasts toasts={toasts} />

        <div className="bottom-nav">
          {TABS.map(t => (
            <button key={t.key} className={"nav-item " + (tab===t.key?"active":"")} onClick={()=>switchTab(t.key)} aria-label={t.label}>
              <Icon name={t.icon} size={20} />
              <span>{t.label}</span>
              <span className="nav-dot"></span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
