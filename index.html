<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Kontrak — manage gigs, get paid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --fs-scale: 1;
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  /* ---- Dark theme (default) — Claude-style warm charcoal palette ---- */
  [data-theme="dark"] {
    --bg: #262624;
    --bg-elevated: #30302e;
    --bg-elevated-2: #3b3a37;
    --bg-sunken: #1e1d1c;
    --border: #47453f;
    --border-subtle: #38372f;
    --text: #f6f4ee;
    --text-secondary: #b6b3aa;
    --text-tertiary: #86837a;
    --accent: #da7756;
    --accent-hover: #e6906f;
    --accent-text: #2a1a12;
    --accent-soft: rgba(218,119,86,0.16);
    --success: #8bab6c;
    --success-soft: rgba(139,171,108,0.16);
    --warning: #d6a24f;
    --warning-soft: rgba(214,162,79,0.16);
    --danger: #c8695f;
    --danger-soft: rgba(200,105,95,0.16);
    --info: #7fa8c9;
    --info-soft: rgba(127,168,201,0.16);
    --shadow: 0 8px 30px rgba(0,0,0,0.45);
    --overlay: rgba(15,14,13,0.6);
    color-scheme: dark;
  }

  /* ---- Light theme ---- */
  [data-theme="light"] {
    --bg: #faf9f5;
    --bg-elevated: #ffffff;
    --bg-elevated-2: #f1efe6;
    --bg-sunken: #efece2;
    --border: #e3dfd2;
    --border-subtle: #ece9dd;
    --text: #221f1a;
    --text-secondary: #5c584f;
    --text-tertiary: #8b877b;
    --accent: #bf5b39;
    --accent-hover: #a84c2d;
    --accent-text: #fff8f4;
    --accent-soft: rgba(191,91,57,0.10);
    --success: #4f7a3c;
    --success-soft: rgba(79,122,60,0.12);
    --warning: #a9761f;
    --warning-soft: rgba(169,118,31,0.12);
    --danger: #a8392f;
    --danger-soft: rgba(168,57,47,0.12);
    --info: #3f6a8a;
    --info-soft: rgba(63,106,138,0.12);
    --shadow: 0 8px 30px rgba(60,50,30,0.12);
    --overlay: rgba(40,35,25,0.35);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg-sunken);
    color: var(--text);
    font-size: calc(15px * var(--fs-scale));
    line-height: 1.45;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  @media (min-width: 560px) {
    body {
      background: var(--bg-sunken);
    }
  }

  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  ::selection { background: var(--accent-soft); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------------- App shell ---------------- */
  #root { width: 100%; height: 100vh; height: 100dvh; }

  .app-shell {
    width: 100%;
    height: 100%;
    display: flex;
    background: var(--bg-sunken);
  }

  /* Sidebar — desktop/tablet only */
  .sidebar { display: none; }
  @media (min-width: 860px) {
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 236px;
      flex-shrink: 0;
      height: 100%;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border-subtle);
      padding: 22px 16px;
    }
  }
  .sidebar-brand {
    padding: 2px 10px 18px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 10px;
  }
  .sidebar-brand .wordmark { font-size: 1.25em; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sidebar-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 10px;
    background: none; border: none; text-align: left;
    color: var(--text-secondary); font-size: 0.88em; font-weight: 600;
    position: relative;
  }
  .sidebar-item:hover { background: var(--bg-elevated-2); color: var(--text); }
  .sidebar-item.active { background: var(--accent-soft); color: var(--accent); }
  .sidebar-item.active::before {
    content: ""; position: absolute; left: -16px; top: 9px; bottom: 9px;
    width: 3px; background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .sidebar-profile {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px; padding: 9px 10px;
    border-radius: 12px; border: 1px solid var(--border-subtle);
    background: var(--bg-elevated-2);
    text-align: left;
  }
  .sidebar-profile:hover { border-color: var(--accent); }

  .device {
    width: 100%;
    height: 100%;
    flex: 1;
    min-width: 0;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 12px;
    flex-shrink: 0;
    background: var(--bg);
  }
  @media (min-width: 860px) {
    .topbar { padding: 22px 32px 16px; border-bottom: 1px solid var(--border-subtle); }
  }
  .topbar-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.28em;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar-sub { color: var(--text-tertiary); font-size: 0.82em; margin-top: 2px; }
  .header-new-job-btn { display: none; }
  @media (min-width: 860px) {
    .header-new-job-btn { display: inline-flex; }
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 96px;
    -webkit-overflow-scrolling: touch;
  }
  .content::-webkit-scrollbar { width: 0; }
  @media (min-width: 860px) {
    .content { padding: 24px 32px 48px; max-width: 1180px; margin: 0 auto; width: 100%; }
  }

  .bottom-nav {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border-subtle);
    padding: 8px 6px calc(env(safe-area-inset-bottom, 8px) + 4px);
    z-index: 40;
  }
  @media (min-width: 860px) {
    .bottom-nav { display: none; }
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    padding: 6px 2px;
    color: var(--text-tertiary);
    font-size: 0.68em;
    font-weight: 500;
    border-radius: var(--radius-sm);
    transition: color .15s ease;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item .nav-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    margin-top: -1px;
  }
  .nav-item.active .nav-dot { opacity: 1; }

  /* ---------------- Icon ---------------- */
  svg.icn { flex-shrink: 0; }

  /* ---------------- Buttons ---------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    padding: 11px 16px;
    font-weight: 600;
    font-size: 0.9em;
    transition: transform .1s ease, background .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--bg-elevated-2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--text-secondary); }
  .btn-ghost:hover { color: var(--text); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 7px 12px; font-size: 0.78em; }
  .btn-icon { padding: 9px; border-radius: 50%; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-elevated-2); border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }

  .fab {
    position: absolute;
    right: 20px; bottom: 84px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    border: none;
    z-index: 30;
  }
  .fab:active { transform: scale(0.94); }
  @media (min-width: 860px) {
    .fab { right: 40px; bottom: 40px; }
  }

  .fab-dial {
    position: absolute;
    right: 20px; bottom: 84px;
    z-index: 30;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-end;
    gap: 10px;
  }
  @media (min-width: 860px) {
    .fab-dial { right: 40px; bottom: 40px; }
  }
  .fab-dial .fab { position: static; right: auto; bottom: auto; }

  .fab-backdrop { position: absolute; inset: 0; z-index: 25; background: transparent; }

  .fab-menu-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    padding: 7px 7px 7px 16px; border-radius: 100px;
    font-weight: 600; font-size: 0.85em; color: var(--text);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    white-space: nowrap;
    animation: fab-pop .16s ease;
  }
  .fab-menu-item:hover { border-color: var(--accent); }
  .fab-menu-icon {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes fab-pop {
    from { opacity: 0; transform: translateY(6px) scale(0.92); }
    to { opacity: 1; transform: none; }
  }


  /* ---------------- Cards ---------------- */
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 14px;
  }
  .card + .card { margin-top: 10px; }
  .card-tap { text-align: left; width: 100%; background: var(--bg-elevated); }
  .card-tap:hover { border-color: var(--border); }
  .row { display: flex; align-items: center; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .stack { display: flex; flex-direction: column; }

  .section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.95em;
    letter-spacing: 0.01em;
    margin: 22px 0 10px;
    color: var(--text);
  }
  .section-title:first-child { margin-top: 4px; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.68em;
    font-weight: 600;
    color: var(--text-tertiary);
  }

  /* ---------------- Badges ---------------- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.72em; font-weight: 600;
    padding: 4px 9px; border-radius: 100px;
    white-space: nowrap;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-scheduled { background: var(--info-soft); color: var(--info); }
  .badge-in_progress { background: var(--warning-soft); color: var(--warning); }
  .badge-review { background: var(--accent-soft); color: var(--accent); }
  .badge-complete { background: var(--success-soft); color: var(--success); }
  .badge-paid { background: var(--success-soft); color: var(--success); }
  .badge-draft { background: var(--bg-elevated-2); color: var(--text-secondary); }
  .badge-sent { background: var(--info-soft); color: var(--info); }
  .badge-overdue { background: var(--danger-soft); color: var(--danger); }

  /* ---------------- Avatar ---------------- */
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85em; flex-shrink: 0;
    font-family: var(--font-display);
  }
  .avatar-sm { width: 32px; height: 32px; font-size: 0.72em; }
  .avatar-lg { width: 60px; height: 60px; font-size: 1.2em; }

  /* ---------------- Forms ---------------- */
  .form-group { margin-bottom: 14px; }
  .label {
    display: block; font-size: 0.78em; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 6px;
  }
  .input, .textarea, .select {
    width: 100%;
    background: var(--bg-elevated-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    color: var(--text);
    font-size: 0.92em;
  }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
  .input::placeholder, .textarea::placeholder { color: var(--text-tertiary); }
  .textarea { resize: vertical; min-height: 74px; }
  .input-row { display: flex; gap: 10px; }
  .input-row > * { flex: 1; }

  .segmented {
    display: flex; gap: 4px; background: var(--bg-elevated-2);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
    padding: 3px;
  }
  .segmented button {
    flex: 1; background: none; border: none; padding: 8px 6px;
    border-radius: 6px; font-size: 0.82em; font-weight: 600;
    color: var(--text-secondary);
  }
  .segmented button.active { background: var(--bg-elevated); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.15); }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -20px 14px; padding-left: 20px; padding-right: 20px; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 7px 13px; border-radius: 100px;
    border: 1px solid var(--border); background: var(--bg-elevated);
    color: var(--text-secondary); font-size: 0.8em; font-weight: 600;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 14px;
  }
  .search-bar input { flex: 1; background: none; border: none; font-size: 0.9em; }
  .search-bar input:focus { outline: none; }

  /* ---------------- Stat cards ---------------- */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }

  /* ---------------- Responsive layout helpers (desktop) ---------------- */
  .grid-list { display: block; }
  .dash-columns { display: block; }
  .job-detail-grid { display: block; }
  .client-detail-grid { display: block; }
  .detail-narrow { display: block; }

  @media (min-width: 860px) {
    .grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      align-items: start;
    }
    .grid-list .card, .grid-list .ticket { margin-top: 0; margin-bottom: 0 !important; }

    .dash-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .job-detail-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 28px;
      align-items: start;
    }
    .job-detail-grid .col-main .section-title:first-child { margin-top: 4px; }

    .client-detail-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 28px;
      align-items: start;
    }

    .detail-narrow { max-width: 640px; margin: 0 auto; }
  }
  .stat-card {
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md); padding: 12px 10px;
  }
  .stat-value { font-family: var(--font-mono); font-weight: 600; font-size: 1.08em; }
  .stat-label { font-size: 0.68em; color: var(--text-tertiary); margin-top: 3px; font-weight: 500; }

  /* ---------------- Progress bar mini ---------------- */
  .progress-mini { height: 5px; border-radius: 3px; background: var(--bg-elevated-2); overflow: hidden; margin-top: 8px; }
  .progress-mini-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }

  /* ---------------- Signature: Work-order stepper ---------------- */
  .stepper {
    display: flex; align-items: flex-start; justify-content: space-between;
    position: relative; padding: 6px 2px 2px;
  }
  .stepper-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative; flex: 1; z-index: 2;
  }
  .stepper-track {
    position: absolute; top: 15px; left: 6%; right: 6%; height: 2px;
    background: var(--border); z-index: 1;
  }
  .stepper-track-fill {
    position: absolute; top: 15px; left: 6%; height: 2px;
    background: var(--accent); z-index: 1; transition: width .35s ease;
  }
  .stepper-dot {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-elevated); border: 2px solid var(--border);
    color: var(--text-tertiary);
  }
  .stepper-dot.done { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .stepper-dot.current {
    border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .stepper-label { font-size: 0.62em; font-weight: 600; color: var(--text-tertiary); text-align: center; }
  .stepper-label.done, .stepper-label.current { color: var(--text); }

  .stamp {
    display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid var(--accent); color: var(--accent);
    border-radius: 8px; padding: 6px 12px;
    font-family: var(--font-display); font-weight: 700;
    font-size: 0.78em; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--accent-soft);
  }

  /* ---------------- Ticket / invoice styling ---------------- */
  .ticket {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
  }
  .ticket-perf {
    height: 12px;
    background-image: radial-gradient(circle at 10px 6px, var(--bg-sunken) 5px, transparent 5.5px);
    background-size: 20px 12px;
    background-repeat: repeat-x;
  }
  @media (min-width: 560px) {
    .ticket-perf { background-image: radial-gradient(circle at 10px 6px, var(--bg) 5px, transparent 5.5px); }
  }
  .ticket-body { padding: 16px; }
  .ticket-dash {
    border-top: 1.5px dashed var(--border);
    margin: 12px 0;
  }

  /* ---------------- Photo grid ---------------- */
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photo-tile {
    aspect-ratio: 1; border-radius: var(--radius-sm);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.92);
    position: relative; overflow: hidden; border: 1px solid var(--border-subtle);
  }
  .photo-tile-label {
    position: absolute; bottom: 5px; left: 5px; right: 5px;
    font-size: 0.6em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    background: rgba(0,0,0,0.4); border-radius: 4px; padding: 2px 5px;
    text-align: center;
  }
  .photo-tile-add {
    background: var(--bg-elevated-2); border: 1.5px dashed var(--border);
    color: var(--text-tertiary);
  }

  /* ---------------- File row ---------------- */
  .file-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid var(--border-subtle);
  }
  .file-row:last-child { border-bottom: none; }
  .file-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-elevated-2); display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); flex-shrink: 0;
  }

  /* ---------------- QR box ---------------- */
  .qr-wrap {
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; border-radius: var(--radius-md);
    padding: 14px; width: 176px; height: 176px; margin: 0 auto;
  }
  .qr-fallback {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    width: 100%; height: 100%;
  }
  .qr-fallback div { background: #1a1a1a; border-radius: 1px; }
  .qr-fallback div.off { background: transparent; }

  /* ---------------- Modal / sheet ---------------- */
  .modal-overlay {
    position: absolute; inset: 0; background: var(--overlay);
    display: flex; align-items: flex-end; z-index: 50;
  }
  .modal-sheet {
    background: var(--bg-elevated); width: 100%;

function Stepper({ stage }) {
  const idx = stageIndex(stage);
  const fillPct = idx <= 0 ? 0 : (idx / (STAGES.length - 1)) * 88;
  return (
    <div className="stepper">
      <div className="stepper-track"></div>
      <div className="stepper-track-fill" style={{ width: fillPct + "%" }}></div>
      {STAGES.map((s, i) => {
        const done = i < idx, current = i === idx;
        return (
          <div className="stepper-item" key={s.key}>
            <div className={"stepper-dot " + (done ? "done" : current ? "current" : "")}>
              <Icon name={done ? "check" : s.icon} size={14} />
            </div>
            <div className={"stepper-label " + (done ? "done" : current ? "current" : "")}>{s.label}</div>
          </div>
        );
      })}
    </div>
  );
}
